/* ================= WIKI ================= */
function parentOf(id){const v=PAGES[id]?.f?.Parent;const m=v&&/\[\[([^\]|]+)/.exec(v);return m&&PAGES[m[1].trim()]?m[1].trim():null;}
function ancestry(id){const a=[];let x=parentOf(id),n=0;while(x&&n++<8){a.unshift(x);x=parentOf(x);}return a;}
const childrenOf=id=>Object.keys(PAGES).filter(o=>parentOf(o)===id);
function peopleAt(id){const places=[id,...childrenOf(id)];return Object.keys(PAGES).filter(o=>['npc','pc'].includes(PAGES[o].type)&&places.some(pl=>refs(PAGES[o].f?.Location||'',pl)));}
function areasHTML(p){if(!p.areas?.length)return '';return `<div class="tablewrap"><table class="areas"><thead><tr><th>#</th><th>Area</th><th>What is here</th></tr></thead><tbody>${p.areas.map(a=>`<tr><td class="mono">${esc(a.n)}</td><td><strong>${esc(a.a)}</strong></td><td>${inline(a.t)}</td></tr>`).join('')}</tbody></table></div>`;}
function monogram(t){return t.replace(/^(The|Lady|Captain|Lord)\s+/,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function fieldBody(p,k){
 if(k==='AREAS')return areasHTML(p);
 if(k==='CHILDREN'){const c=childrenOf(S.page);return c.length?`<ul class="poi">${c.map(o=>`<li>${wl(o)}<span class="muted small">${esc(TYPES[PAGES[o].type].label)}${PAGES[o].f?.Type?' · '+esc(PAGES[o].f.Type):''}</span><span class="poi-lead">${inline((PAGES[o].lead||'').split('. ')[0].replace(/\.$/,'')+'.')}</span></li>`).join('')}</ul>`:'';}
 if(k==='PEOPLE'){const c=peopleAt(S.page);return c.length?`<ul class="people">${c.map(o=>`<li><span class="mono-badge sm ${PAGES[o].type==='pc'?'pc':''}">${esc(monogram(PAGES[o].title))}</span><span>${wl(o)}<br><span class="muted small">${inline(PAGES[o].f?.Role||PAGES[o].f?.['Class and level']||'')}</span></span></li>`).join('')}</ul>`:'';}
 if(!p.f?.[k])return '';
 const fresh=S.fresh.has(S.page+':'+k)?'fresh':'';
 if(k==='impression')return `<div class="impression ${fresh}"><div class="eyebrow">Read aloud</div><p>${inline(p.f[k])}</p></div>`;
 if(k==='effects')return `<div class="mech ${fresh}">${md(p.f[k])}</div>`;
 return `<div class="${fresh}">${md(p.f[k])}</div>`;}
function groupsHTML(p,skip=[]){const T=TYPES[p.type];const toc=[];
 const pv=PV();const openP=PROPS.filter(x=>x.status!=='accepted');const pendOn=k=>openP.filter(x=>x.changes.some(c=>c.target===S.page&&c.key===k));
 const html=T.groups.map(([g,fields,gm])=>{if(pv&&gm)return '';const parts=[],empty=[];
  fields.forEach(([k,l])=>{if(skip.includes(k))return;const b=fieldBody(p,k);if(b){const pp=pv?[]:pendOn(k);parts.push(`<section class="sec" id="s-${k}"><h2>${esc(l)}${pp.map(x=>` <a href="#" class="pend" data-openprop="${x.id}" title="Open the proposal">Proposal pending: ${esc(x.title)}</a>`).join('')}</h2>${b}</section>`);toc.push([k,l,g]);}else if(!AUTO.includes(k))empty.push(l);});
  if(pv)empty.length=0;if(!parts.length)return empty.length?`<div class="grp-empty"><strong>${esc(g)}</strong>${gm?' <span class="pill p-hot">GM</span>':''} <span>not written yet: ${empty.map(esc).join(', ')}</span></div>`:'';
  return `<div class="grp-block ${gm?'gm':''}" id="g-${esc(g).replace(/\W+/g,'-')}"><div class="grp-h"><span>${esc(g)}</span>${gm?'<span class="pill p-hot">GM only</span>':''}</div>${parts.join('')}${empty.length?`<p class="empty-note">Not written yet: ${empty.map(esc).join(', ')}</p>`:''}</div>`;}).join('');
 const extra=(p.body||[]).map((b,i)=>{toc.push(['b'+i,b.h,'Added']);return `<section class="sec" id="s-b${i}"><h2>${esc(b.h)}</h2><div class="${b.fresh?'fresh':''}">${md(b.t)}</div></section>`;}).join('');
 S.toc=toc;const st=studioFor(p.type);
 return html+(extra&&!pv?`<div class="grp-block"><div class="grp-h"><span>Added</span></div>${extra}</div>`:'')+(!pv&&(st.type||p.type==='thread')?`<p class="develop-line"><a href="#" class="wl" data-develop="${S.page}">Develop this ${esc(TYPES[p.type].label.toLowerCase())} in the ${esc(st.name)} studio →</a></p>`:'');}
const IMG={region:'Map',settlement:'Map',building:'Illustration',site:'Map',dungeon:'Map',npc:'Portrait',pc:'Portrait',faction:'Emblem',deity:'Holy symbol',culture:'Illustration',creature:'Illustration',item:'Illustration',encounter:'Battle map',lore:'Illustration'};
function infobox(p){const T=TYPES[p.type];const rows=(T.info||[]).filter(k=>p.f?.[k]&&!(p.type==='item'));
 const kids=childrenOf(S.page);
 if(!rows.length&&!IMG[p.type])return '';
 return `<aside class="infobox"><div class="ib-img" aria-hidden="true"><span>${esc(IMG[p.type]||'Image')}</span></div><div class="ib-title">${esc(p.title)}</div>
  ${rows.length?`<dl>${rows.map(k=>`<div><dt>${esc(k)}</dt><dd>${inline(p.f[k])}</dd></div>`).join('')}</dl>`:''}
  ${kids.length?`<div class="ib-sub"><dt>Contains</dt><dd>${kids.map(o=>wl(o)).join(', ')}</dd></div>`:''}
  ${!PV()&&(T.info||[]).filter(k=>!p.f?.[k]&&p.type!=='item').length?`<div class="ib-missing">Empty: ${(T.info||[]).filter(k=>!p.f?.[k]).map(esc).join(', ')}</div>`:''}</aside>`;}
function pageHead(p,titleHTML){const T=TYPES[p.type];const st=studioFor(p.type);const anc=ancestry(S.page);
 return `<div class="crumbs"><a href="#" data-nav="campaign-state" class="wl">Wiki</a>${anc.length?anc.map(a=>`<span>/</span>${wl(a)}`).join(''):`<span>/</span><span>${esc(T.group)}</span>`}</div>
  ${titleHTML||`<h1>${esc(p.title)}</h1>${p.aliases?`<div class="aka">also ${p.aliases.map(esc).join(', ')}</div>`:''}`}
  <div class="docbar"><span class="pill p-draft">${esc(T.label)}</span>${p.gm?'<span class="pill p-hot">GM only</span>':''}${p.prov?`<span class="pill p-working">${esc(p.prov)}</span>`:''}

/* ---------- graph lens ---------- */
const GCOL={Places:'var(--accent)',People:'var(--review)',Party:'var(--review)',Factions:'var(--ochre)',Threads:'var(--danger)'};
function graphHTML(id){
 const nb=[...new Set([...outlinks(id),...backlinks(id)])].filter(x=>PAGES[x]&&(!PV()||visible(x)));
 const n=nb.length;const R=n>12?250:170;const W=900,H=Math.round(2*R*.95+110),cx=W/2,cy=H/2;
 const pos={};pos[id]=[cx,cy];
 nb.forEach((x,i)=>{const ring=n>12&&i%2?1:0;const r=ring?250:170;const a=-Math.PI/2+i*2*Math.PI/Math.max(n,1);pos[x]=[cx+r*1.35*Math.cos(a),cy+r*Math.sin(a)*.95];});
 const edges=[];nb.forEach(x=>edges.push([id,x,1]));
 nb.forEach((a,i)=>nb.slice(i+1).forEach(b=>{if(refs(pageText(a),b)||refs(pageText(b),a))edges.push([a,b,0]);}));
 const col=x=>GCOL[TYPES[PAGES[x].type].group]||'var(--ink-3)';
 const node=x=>{const [X,Y]=pos[x];const c=x===id;const t=PV()?pageName(x):PAGES[x].title;return `<g class="gnode ${c?'gc':''}" data-nav="${x}" tabindex="0"><circle cx="${X}" cy="${Y}" r="${c?14:9}" fill="${col(x)}"/><text x="${X}" y="${Y+(c?30:24)}" text-anchor="middle">${esc(t.length>22?t.slice(0,21)+'…':t)}</text></g>`;};
 const groups=[...new Set([id,...nb].map(x=>TYPES[PAGES[x].type].group))];
 return `<div class="lens-card"><div class="lens-h"><span class="eyebrow">Local graph · ${n} connection${n===1?'':'s'}</span><span class="legend">${groups.map(g=>`<span><i style="background:${GCOL[g]||'var(--ink-3)'}"></i>${esc(g)}</span>`).join('')}</span></div>
  <div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" class="graph" role="img" aria-label="Pages linked to ${esc(PAGES[id].title)}">${edges.map(([a,b,m])=>`<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" class="${m?'ge':'ge2'}"/>`).join('')}${nb.map(node).join('')}${node(id)}</svg></div>
  <p class="muted small">Lines show links in either direction. Click a node to open it; the graph stays on as you move.</p></div>`;}

/* ---------- map lens ---------- */
function mapHTML(id){
 let subject=id,focus=null;
 if(!childrenOf(id).length&&parentOf(id)){subject=parentOf(id);focus=id;}
 const kids=childrenOf(subject).filter(x=>!PV()||visible(x));const W=1000,H=620;
 const pt=(x,i)=>PAGES[x].pin||{x:W/2+300*Math.cos(i*2.1),y:H/2+200*Math.sin(i*2.1)};
 const pins=kids.map((x,i)=>{const p=pt(x,i);const f=x===focus;return `<g class="pin ${f?'focus':''}" data-pin="${x}" transform="translate(${p.x},${p.y})" tabindex="0"><circle r="${f?11:8}"/><text y="-16" text-anchor="middle">${esc(PV()?pageName(x):PAGES[x].title)}</text></g>`;}).join('');
 return `<div class="lens-card"><div class="lens-h"><span class="eyebrow">Map · ${esc(PAGES[subject].title)}</span>${focus?`<span class="muted small">${esc(PAGES[focus].title)} shown on its parent map</span>`:''}</div>
  <div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" class="map" id="mapsvg" role="img" aria-label="Map of ${esc(PAGES[subject].title)}">
   <defs><pattern id="mg" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" class="mgrid"/></pattern></defs>
   <rect width="${W}" height="${H}" class="mbg"/><rect width="${W}" height="${H}" fill="url(#mg)"/>
   <g transform="translate(930,80)" class="compass"><circle r="28"/><path d="M0-24L6 0L0 24L-6 0Z"/><text y="-34" text-anchor="middle">N</text></g>
   ${pins||`<text x="${W/2}" y="${H/2}" text-anchor="middle" class="mempty">No places filed under ${esc(PAGES[subject].title)} yet</text>`}</svg></div>
  <p class="muted small">Placeholder parchment. The full build lets you upload a real map image and place pins on it. ${PV()?'':'Drag a pin to move it; click to open.'}</p></div>`;}
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-pin]');if(!g)return;const svg=$('#mapsvg');drag={id:g.dataset.pin,g,svg,x0:e.clientX,y0:e.clientY,moved:false};if(!PV())g.setPointerCapture?.(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!drag||PV())return;if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>4)drag.moved=true;if(!drag.moved)return;
 const pt=drag.svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(drag.svg.getScreenCTM().inverse());drag.g.setAttribute('transform',`translate(${p.x},${p.y})`);drag.p={x:Math.round(Math.max(20,Math.min(980,p.x))),y:Math.round(Math.max(30,Math.min(600,p.y)))};});

/* ---------- persistence ---------- */
const STORE='designspace-proto-v6';
function save(){clearTimeout(save.t);save.t=setTimeout(()=>{try{localStorage.setItem(STORE,JSON.stringify({c:CAMPAIGNS,n:nextId,u:S.user}));}catch(e){}},300);}
addEventListener('pagehide',()=>{try{localStorage.setItem(STORE,JSON.stringify({c:CAMPAIGNS,n:nextId,u:S.user}));}catch(e){}});
function restore(){try{const r=JSON.parse(localStorage.getItem(STORE)||'null');if(r&&r.c&&r.c.gm){Object.keys(CAMPAIGNS).forEach(k=>delete CAMPAIGNS[k]);Object.assign(CAMPAIGNS,r.c);nextId=Math.max(nextId,r.n||0);S.user=r.u||null;return true;}}catch(e){}return false;}

/* ---------- render ---------- */
function render(){
 if(!S.user)S.ws='login';
 const player=S.user?.role==='player';if(player&&S.ws!=='wiki')S.ws='wiki';
 const inCamp=!['home','login'].includes(S.ws);
 $('.ws').hidden=!inCamp||player;$('#campchip').hidden=!inCamp;
 if(inCamp)$('#campchip').innerHTML=player?`${esc(C.name)} <span class="muted">· Player wiki</span>`:`${esc(C.name)} <span class="muted">· ${esc(RULESETS[C.ruleset].short)}</span>`;
 const pb=$('#pvbtn');pb.hidden=!(S.ws==='wiki'&&!player);pb.textContent=S.pv?'Back to GM view':'Preview as player';pb.classList.toggle('on',!!S.pv);
 $('#searchbtn').hidden=!inCamp;
 const u=$('#userchip');u.hidden=!S.user;if(S.user)u.innerHTML=`<span>${esc(S.user.name)}</span><span class="muted small">${player?esc(PAGES[S.user.pc]?.title||'Player'):'GM'}</span><button class="btn ghost small" data-signout>Sign out</button>${player?'':'<button class="btn ghost small" data-reset title="Clear saved prototype changes">Reset</button>'}`;
 document.querySelectorAll('.ws button').forEach(b=>b.setAttribute('aria-current',b.dataset.ws===S.ws));
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===S.ws));
 if(S.ws==='login')renderLogin();if(S.ws==='home')renderHome();if(S.ws==='wiki')renderWiki();if(S.ws==='build')renderBuild();if(S.ws==='sess')renderSess();
 if(inCamp&&!player){const q=PROPS.filter(x=>x.status==='review').length;const b=$('#qcount');b.hidden=!q;b.textContent=q;}
 save();
}

/* ================= PLAYER KNOWLEDGE: reveals, player names, player versions, rumours, journal, spoiler check =================
   One source of truth. Players see the GM's own text for anything revealed. A player version is written only where the
   party believes something different, or for a rumour. Reveals are proposed from play and approved with the session. */
const RVSTATES={rumour:['Rumour','rv-rumour'],believed:['What we believe','rv-believed'],known:['Known','rv-known']};
function viewer(){return S.user?.role==='player'?(S.user.pc||'party'):(S.pvAs||'party');}
function fieldsAll(type){return [['__lead','Lead'],...fieldsFor(type)];}
function rvFor(id,k,v){const e=PAGES[id]?.rv?.[k];if(!e)return null;v=v||viewer();if(e.to==='party'||(Array.isArray(e.to)&&(v==='gm'||e.to.includes(v))))return e;return null;}
function visible(id,v){const p=PAGES[id];if(!p)return false;if(id==='campaign-state')return true;return !!p.rv&&Object.keys(p.rv).some(k=>rvFor(id,k,v));}
function titleKnown(id,v){return !PAGES[id]?.known||!!rvFor(id,'__title',v);}
function pageName(id,v){const p=PAGES[id];if(!p)return nice(id);return titleKnown(id,v)?p.title:p.known;}
function rawField(p,k){return k==='__lead'?p.lead:p.f?.[k];}
function shownText(id,k,v){const p=PAGES[id];const e=rvFor(id,k,v);if(!e)return null;const pf=p.pf?.[k];
 if((e.s==='believed'||e.s==='rumour')&&pf)return pf;return rawField(p,k)||pf||null;}
function pvEvents(v){return TL.filter(e=>['party','reveal'].includes(e.type)&&(e.links||[]).some(x=>visible(x,v))).sort((a,b)=>a.day-b.day);}
function audLabel(to){return to==='party'?'Party':(to||[]).map(pc=>PAGES[pc]?.title.split(' ')[0]||pc).join(', ')+' only';}

/* ---------- player-facing page ---------- */
function pvPage(p,id){const T=TYPES[p.type];const v=viewer();S.toc=[];
 if(p.type==='session'){const s=SESS[p.sess];return `<div class="crumbs"><a href="#" data-nav="campaign-state" class="wl">Player wiki</a></div><h1>${esc(p.title)}</h1><div class="card" style="margin-top:14px">${md(s.recap||'')}</div>`;}
 const badge=e=>e.s==='known'?'':`<span class="rvb ${RVSTATES[e.s][1]}">${RVSTATES[e.s][0]}</span>`;
 const lead=shownText(id,'__lead',v);
 const info=(T.info||[]).filter(k=>shownText(id,k,v));
 const special=[...(T.triad||[]),['voice','Voice'],['impression','First impression'],['public','Public face'],['hidden','Hidden truth'],['willdo','Will do'],['wont','Won\'t do'],['player','Handout']].filter(([k])=>!(T.f||[]).some(x=>x[0]===k));
 const sec=(k,l)=>{const t=shownText(id,k,v);if(!t)return '';const e=rvFor(id,k,v);S.toc.push([k,l,'']);
  const body=k==='impression'?`<div class="impression"><p>${inline(t)}</p></div>`:k==='player'?`<div class="paper"><p>${esc(t).replace(/\n/g,'<br>')}</p></div>`:k==='voice'?`<blockquote class="voice">${esc(t)}</blockquote>`:md(t);
  return `<section class="sec" id="s-${k}"><h2>${esc(l)} ${badge(e)}</h2>${body}${e.s==='rumour'?'<p class="muted small">Unconfirmed. It may not be true.</p>':''}</section>`;};
 const groups=T.groups.map(([g,fs])=>{const parts=fs.filter(([k])=>!['AREAS','CHILDREN','PEOPLE'].includes(k)).map(([k,l])=>sec(k,l)).join('');return parts?`<div class="grp-block"><div class="grp-h"><span>${esc(g)}</span></div>${parts}</div>`:'';}).join('');
 const notes=journalFor(id,v);
 return `<div class="crumbs"><a href="#" data-nav="campaign-state" class="wl">Player wiki</a><span>/</span><span>${esc(T.group)}</span></div>
  <h1>${esc(pageName(id,v))}</h1><div class="docbar"><span class="pill p-draft">${esc(T.label)}</span><span style="flex:1"></span>${lensBar(p)}</div>
  <div class="article"><div class="art-main">${lead?`<div class="lead">${inline(lead)}</div>${rvFor(id,'__lead',v).s!=='known'?`<p>${badge(rvFor(id,'__lead',v))}</p>`:''}`:''}
   ${special.map(([k,l])=>sec(k,l)).join('')}${groups}
   ${notes.length?`<div class="grp-block"><div class="grp-h"><span>Party notes</span></div>${notes.map(journalCard).join('')}</div>`:''}
   ${S.user?.role==='player'?`<p class="develop-line"><button class="btn" data-jabout="${id}">Write a note about this</button></p>`:''}</div>
  ${info.length||IMG[p.type]?`<aside class="infobox"><div class="ib-img" aria-hidden="true"><span>${esc(IMG[p.type]||'Image')}</span></div><div class="ib-title">${esc(pageName(id,v))}</div>${info.length?`<dl>${info.map(k=>`<div><dt>${esc(k)}</dt><dd>${inline(shownText(id,k,v))}</dd></div>`).join('')}</dl>`:''}</aside>`:''}</div>`;}

/* ---------- GM reveal lens ---------- */
function revealLens(id){const p=PAGES[id];const pcs=Object.keys(PAGES).filter(x=>PAGES[x].type==='pc');
 const rows=fieldsAll(p.type).filter(([k])=>rawField(p,k)||p.pf?.[k]);
 const nShown=rows.filter(([k])=>p.rv?.[k]).length;
 const sel=(k)=>{const e=p.rv?.[k];return `<select data-rvstate="${k}" aria-label="State"><option value="">Hidden</option>${Object.entries(RVSTATES).map(([s,[l]])=>`<option value="${s}" ${e?.s===s?'selected':''}>${l}</option>`).join('')}</select>`;};
 const aud=(k)=>{const e=p.rv?.[k];if(!e)return '<span class="muted small">—</span>';const cur=e.to==='party'?'party':e.to[0];return `<select data-rvto="${k}" aria-label="Who"><option value="party" ${cur==='party'?'selected':''}>Whole party</option>${pcs.map(pc=>`<option value="${pc}" ${cur===pc&&e.to!=='party'?'selected':''}>${esc(PAGES[pc].title)} only</option>`).join('')}</select>`;};
 const issues=spoilers(['party',...pcs],[id]);
 return `<div class="lens-card"><div class="lens-h"><span class="eyebrow">Player knowledge · ${nShown} of ${rows.length} parts revealed</span>
   <span class="row"><button class="btn small" data-pvas="party">Preview as party</button>${pcs.map(pc=>`<button class="btn small" data-pvas="${pc}">as ${esc(PAGES[pc].title.split(' ')[0])}</button>`).join('')}</span></div>
  <p class="muted small" style="margin:0 0 10px">Players see your own text for anything revealed. Write a player version only where they believe something different, or for a rumour. Reveals from play arrive as proposals after each session.</p>
  <div class="rvname"><label class="lbl">Name players use<input type="text" data-known value="${esc(p.known||'')}" placeholder="${esc(p.title)} (leave empty to use the real name)"></label>
   ${p.known?`<label class="lbl">Real name<select data-rvstate="__title"><option value="">Hidden: players see "${esc(p.known)}"</option><option value="known" ${p.rv?.__title?'selected':''}>Known to players</option></select></label>`:''}</div>
  ${issues.length?`<div class="spoil"><strong>Spoiler check · ${issues.length}</strong><ul>${issues.map(spoilerLi).join('')}</ul></div>`:`<div class="spoil ok">Spoiler check: nothing on this page names or links to anything players can't see.</div>`}
  <div class="tablewrap"><table class="rvtable"><thead><tr><th>Part</th><th>Players see</th><th>Who</th><th>Player version</th></tr></thead><tbody>
  ${rows.map(([k,l])=>{const e=p.rv?.[k];const pfOpen=S.pfOpen===k;return `<tr class="${e?RVSTATES[e.s][1]:''}"><td><strong>${esc(l)}</strong><div class="muted small rvprev">${esc(plain(rawField(p,k)||'').slice(0,110))}</div>${e?`<div class="muted small">Since ${esc(e.when||'—')}</div>`:''}</td><td>${sel(k)}</td><td>${aud(k)}</td>
   <td>${p.pf?.[k]&&!pfOpen?`<div class="small">${esc(plain(p.pf[k]).slice(0,90))}</div>`:''}${pfOpen?`<textarea data-pftext="${k}" rows="3" placeholder="What the party believes or has heard">${esc(p.pf?.[k]||'')}</textarea>`:''}<button class="btn ghost small" data-pfedit="${k}">${pfOpen?'Done':p.pf?.[k]?'Edit':'Add'}</button></td></tr>`;}).join('')}</tbody></table></div></div>`;}
function setReveal(id,k,s,to,when,src){const p=PAGES[id];p.rv??={};if(!s){delete p.rv[k];HIST[id].push({d:'Today',t:`Hid "${fieldLabel(p.type,k)}" from players`});return;}
 p.rv[k]={s,to:to||p.rv[k]?.to||'party',when:when||fmtDay(C.today),src:src||'gm'};HIST[id].push({d:when||'Today',t:`${RVSTATES[s][0]}: "${k==='__lead'?'Lead':k==='__title'?'Real name':fieldLabel(p.type,k)}" for ${audLabel(p.rv[k].to)}`,acc:src==='play'});}

/* ---------- spoiler check ---------- */
function spoilers(viewers,only){const out=[];const seen=new Set();
 viewers.forEach(v=>{Object.keys(PAGES).forEach(id=>{if(only&&!only.includes(id))return;if(!visible(id,v))return;const p=PAGES[id];
  fieldsAll(p.type).forEach(([k,l])=>{const t=shownText(id,k,v);if(!t)return;
   t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,x,lab)=>{x=x.trim();if(PAGES[x]&&!visible(x,v)){const key=id+k+x+(v==='party'?'':'');if(seen.has(key))return;seen.add(key);out.push({id,k,l,v,kind:'link',x,msg:`links to <strong>${esc(PAGES[x].title)}</strong>, which ${v==='party'?'players':esc(PAGES[v]?.title.split(' ')[0])} can't see. It shows as plain text "${esc(lab||PAGES[x].title)}".`});}
    else if(PAGES[x]&&lab&&!titleKnown(x,v)&&[PAGES[x].title,...(PAGES[x].aliases||[])].some(n=>lab.includes(n.replace(/^The /,'')))){const key=id+k+x+'lab';if(!seen.has(key)){seen.add(key);out.push({id,k,l,v,kind:'name',x,msg:`calls <strong>${esc(PAGES[x].known)}</strong> by a name players don't know yet ("${esc(lab)}").`});}}});
   const bare=t.replace(/\[\[[^\]]+\]\]/g,'');
   Object.keys(PAGES).forEach(y=>{if(y===id||['campaign','party','session','rule'].includes(PAGES[y].type))return;const py=PAGES[y];
    const secret=!visible(y,v)?[py.title,...(py.aliases||[])]:!titleKnown(y,v)?[py.title,...(py.aliases||[])].filter(n=>n!==py.known):[];
    secret.map(n=>n.replace(/^The /,'')).filter(n=>n.length>4).forEach(n=>{if(new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(bare)){const key=id+k+y+'m';if(seen.has(key))return;seen.add(key);out.push({id,k,l,v,kind:'mention',x:y,msg:`mentions <strong>"${esc(n)}"</strong>, which ${v==='party'?'players':esc(PAGES[v]?.title.split(' ')[0])} don't know yet.`});}});});
  });});});
 return out;}
function spoilerLi(s){return `<li><a href="#" class="wl" data-nav="${s.id}">${esc(PAGES[s.id].title)}</a> · ${esc(s.l)} ${s.msg} <span class="row" style="display:inline-flex"><button class="btn ghost small" data-spfix="hide:${s.id}:${s.k}">Hide that part</button>${s.kind!=='name'?`<button class="btn ghost small" data-spfix="reveal:${s.x}:${s.v}">Reveal ${esc(PAGES[s.x].title)}'s lead</button>`:''}</span></li>`;}
function withReveals(changes,fn){const saved={};changes.filter(c=>c.op==='reveal'&&c.inc).forEach(c=>{const p=PAGES[c.target];if(!p)return;if(!(c.target in saved))saved[c.target]=JSON.stringify(p.rv||null);p.rv??={};p.rv[c.key]={s:c.state,to:c.to,when:'preview'};});
 try{return fn();}finally{Object.entries(saved).forEach(([id,j])=>{PAGES[id].rv=JSON.parse(j)||undefined;});}}

/* ---------- journal ---------- */
function JOURNAL(){return (C.data.journal??=[]);}
function journalFor(id,v){return JOURNAL().filter(j=>j.about===id&&canSeeJ(j,v));}
function canSeeJ(j,v){if(v==='gm')return j.share!=='private';if(j.share==='party')return true;return j.pc===v;}
const SHARE={party:'Shared with the party',gm:'Only the GM',private:'Just me'};
function journalCard(j){const who=PAGES[j.pc]?.title||j.by;return `<div class="jcard"><div class="jmeta"><strong>${esc(who)}</strong> <span class="muted small">${esc(j.by)} · ${esc(j.when)} · ${SHARE[j.share]}</span>${j.example?' <span class="pill p-draft">Example</span>':''}</div>${j.about&&S.page!==j.about?`<div class="muted small">About ${PAGES[j.about]&&visible(j.about,j.pc)?`<a href="#" class="wl" data-nav="${j.about}">${esc(pageName(j.about,j.pc))}</a>`:'—'}</div>`:''}<p>${esc(j.text)}</p>
 ${S.user?.role!=='player'&&!PV()?(j.promoted?`<a href="#" class="wl small" data-openprop="${j.promoted}">In Worldbuilding →</a>`:`<button class="btn ghost small" data-promote="${j.id}">Use in Worldbuilding</button>`):''}</div>`;}
function journalComposer(){const v=viewer();const opts=Object.keys(PAGES).filter(x=>x!=='campaign-state'&&visible(x,v));
 return `<div class="card jcomp"><label class="lbl">New note<textarea id="jtext" rows="3" placeholder="A theory, a question for the GM, something you want to remember…"></textarea></label>
  <div class="row"><label class="lbl">About<select id="jabout"><option value="">Nothing specific</option>${opts.map(x=>`<option value="${x}" ${S.jAbout===x?'selected':''}>${esc(pageName(x,v))}</option>`).join('')}</select></label>
  <label class="lbl">Share with<select id="jshare">${Object.entries(SHARE).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
  <button class="btn primary" data-jsave style="align-self:end">Save note</button></div></div>`;}
function renderJournalGM(){S.toc=[];const all=JOURNAL().filter(j=>j.share!=='private');
 return `<div class="crumbs"><a href="#" data-nav="campaign-state" class="wl">Wiki</a><span>/</span><span>Campaign</span></div><h1>Player journal</h1>
  <p class="lead">Notes players have shared with the party or with you. Private notes stay private. Turn a note into a Worldbuilding thread instead of copying it.</p>
  ${all.map(journalCard).join('')||'<p class="muted">No shared notes yet.</p>'}`;}

/* ---------- player home (replaces the earlier one) ---------- */
function playerHome(){S.toc=[];const v=viewer();const u=S.user;
 const vis=t=>Object.entries(PAGES).filter(([id,x])=>x.type===t&&visible(id,v));
 const played=Object.entries(SESS).filter(([,s])=>s.status==='played').reverse();
 const card=([id,x])=>`<li><span class="mono-badge sm ${x.type==='pc'?'pc':''}">${esc(monogram(pageName(id,v)))}</span><span>${wl(id)}<br><span class="muted small">${esc(plain(shownText(id,'Role',v)||shownText(id,'Class and level',v)||TYPES[x.type].label))}</span></span></li>`;
 const latest=played[0]?`Session ${played[0][1].n}`:null;
 const fresh=[];Object.keys(PAGES).forEach(id=>Object.entries(PAGES[id].rv||{}).forEach(([k,e])=>{if(latest&&e.when===latest&&rvFor(id,k,v))fresh.push([id,k,e]);}));
 const freshPages=[...new Set(fresh.map(x=>x[0]))];
 const mine=JOURNAL().filter(j=>canSeeJ(j,v)).slice().reverse();
 return `<div class="crumbs"><span>Player wiki</span></div><h1>${esc(C.name)}</h1><div class="lead">What ${v==='party'?'the party knows':'your character knows'}. ${u?.role==='player'&&u.pc&&PAGES[u.pc]?`You play ${wl(u.pc)}.`:''}</div>
  ${freshPages.length?`<section class="sec"><h2>New since ${esc(latest)}</h2><ul class="people">${freshPages.map(id=>`<li><span>${wl(id)}<br><span class="muted small">${fresh.filter(f=>f[0]===id).map(f=>f[1]==='__lead'?'Lead':f[1]==='__title'?'Real name':fieldLabel(PAGES[id].type,f[1])).join(', ')}</span></span></li>`).join('')}</ul></section>`:''}
  ${(()=>{const ho=Object.values(SESS).flatMap(x=>(x.handouts||[]).filter(h=>h.given));return ho.length?`<section class="sec"><h2>Handouts</h2>${ho.map(h=>`<div class="paper sm"><div class="eyebrow">${esc(h.title)} · ${esc(h.when||'')}</div><p>${esc(h.text).replace(/\n/g,'<br>')}</p></div>`).join('')}</section>`:'';})()}
  <section class="sec"><h2>The party</h2><ul class="people">${vis('pc').map(card).join('')}</ul></section>
  <section class="sec"><h2>The story so far</h2>${played.map(([k,s])=>`<div class="recap"><div class="eyebrow">Session ${s.n}${s.day!=null?' · '+esc(fmtDay(s.day)):''}</div><h3>${esc(s.title)}</h3>${md(s.recap||'')}</div>`).join('')}</section>
  <section class="sec"><h2>People you have met</h2><ul class="people">${vis('npc').map(card).join('')||'<li class="muted">None yet</li>'}</ul></section>
  <section class="sec"><h2>Places you know</h2><ul class="people">${[...vis('region'),...vis('settlement'),...vis('site'),...vis('building'),...vis('dungeon')].map(([id,x])=>`<li><span>${wl(id)}<br><span class="muted small">${esc(TYPES[x.type].label)}</span></span></li>`).join('')}</ul></section>
  <section class="sec" id="s-journal"><h2>Journal</h2>${S.user?.role==='player'?journalComposer():'<p class="muted small">Players write here. In preview you see what this player can see.</p>'}${mine.map(journalCard).join('')}</section>
  <section class="sec"><h2>Timeline</h2><ul class="tl-mini">${pvEvents(v).map(e=>`<li><span class="mono muted">${esc(e.past?e.label:fmtDay(e.day))}</span><br>${inline(e.text)}</li>`).join('')}</ul></section>`;}

KIND.reveal=['Reveal to players','upd'];
/* ================= LEAN MODEL: clocks on threads, one timeline, hierarchy, auto context, type = studio ================= */
function clocks(){return Object.entries(PAGES).filter(([,p])=>p.type==='thread'&&p.clock).map(([id,p])=>({id,name:p.title,owner:id,pos:p.clock.pos,portent:p.clock.portent,fired:p.clock.fired}));}
function descendants(id,seen=new Set()){childrenOf(id).forEach(c=>{if(!seen.has(c)){seen.add(c);descendants(c,seen);}});return [...seen];}
function peopleAt(id){const places=[id,...descendants(id)];return Object.keys(PAGES).filter(o=>['npc','pc'].includes(PAGES[o].type)&&places.some(pl=>refs(PAGES[o].f?.Location||'',pl)));}
function membersOf(id){const orgs=[id,...descendants(id)];return Object.keys(PAGES).filter(o=>['npc','pc'].includes(PAGES[o].type)&&orgs.some(g=>refs(PAGES[o].f?.Faction||'',g)));}
const carriedBy=id=>Object.keys(PAGES).filter(o=>refs(PAGES[o].f?.Holder||'',id));
const drivenBy=id=>clocks().filter(c=>c.id===id||refs(PAGES[c.id].f?.['Driven by']||'',id));
const personLi=o=>`<li><span class="mono-badge sm ${PAGES[o].type==='pc'?'pc':''}">${esc(monogram(PAGES[o].title))}</span><span>${wl(o)}<br><span class="muted small">${inline(PAGES[o].f?.Role||PAGES[o].f?.['Class and level']||'')}${PAGES[o].f?.Location&&!refs(PAGES[o].f.Location,S.page)?' · '+inline(PAGES[o].f.Location):''}</span></span></li>`;
function fieldBody(p,k){
 if(k==='AREAS')return areasHTML(p);
 if(k==='CHILDREN'){const c=childrenOf(S.page);return c.length?`<ul class="poi">${c.map(o=>`<li>${wl(o)}<span class="muted small">${esc(TYPES[PAGES[o].type].label)}${PAGES[o].f?.Type?' · '+esc(plain(PAGES[o].f.Type)):''}${childrenOf(o).length?` · contains ${childrenOf(o).length}`:''}</span><span class="poi-lead">${inline((PAGES[o].lead||'').split('. ')[0].replace(/\.$/,'')+'.')}</span></li>`).join('')}</ul>`:'';}
 if(k==='PEOPLE'){const c=peopleAt(S.page);return c.length?`<ul class="people">${c.map(personLi).join('')}</ul>`:'';}
 if(k==='MEMBERS'){const c=membersOf(S.page);return c.length?`<ul class="people">${c.map(personLi).join('')}</ul>`:'';}
 if(k==='CARRIES'){const c=carriedBy(S.page);return c.length?`<ul class="plain">${c.map(o=>`<li>${wl(o)} <span class="muted small">${esc(TYPES[PAGES[o].type].label)}</span></li>`).join('')}</ul>`:'';}
 if(!p.f?.[k])return '';
 const fresh=S.fresh.has(S.page+':'+k)?'fresh':'';
 if(k==='impression')return `<div class="impression ${fresh}"><div class="eyebrow">Read aloud</div><p>${inline(p.f[k])}</p></div>`;
 if(k==='effects')return `<div class="mech ${fresh}">${md(p.f[k])}</div>`;
 return `<div class="${fresh}">${md(p.f[k])}</div>`;}
function kidsBlock(p){const T=TYPES[p.type];if(!T.kids||T.f.some(x=>x[0]==='CHILDREN'))return '';const c=childrenOf(S.page);if(!c.length)return '';
 return `<div class="grp-block"><div class="grp-h"><span>${esc(T.kids)}</span></div><section class="sec" id="s-CHILDREN">${fieldBody(p,'CHILDREN')}</section></div>`;}

/* ---------- nested tree ---------- */
function treeHTML(groups,gl){
 const open=S.open??=new Set();ancestry(S.page).forEach(a=>open.add(a));
 const flat=!!S.q.trim();
 const node=(id,ids,depth)=>{const kids=flat?[]:ids.filter(x=>parentOf(x)===id);const isOpen=open.has(id);
  const name=id==='campaign-state'&&PV()?'Player home':PV()?pageName(id):PAGES[id].title;
  return `<div class="tn" style="--d:${depth}">${kids.length?`<button class="tw" data-tw="${id}" aria-label="${isOpen?'Collapse':'Expand'}" aria-expanded="${isOpen}">${isOpen?'▾':'▸'}</button>`:'<span class="tw-sp"></span>'}<a href="#" data-nav="${id}" aria-current="${id===S.page}">${esc(name)}${S.fresh.has(id)?'<span class="new">NEW</span>':''}${!PV()&&id!=='campaign-state'&&visible(id,'gm')?'<span class="eye" title="Players know something about this">●</span>':''}${kids.length&&!isOpen?`<span class="tcount">${kids.length}</span>`:''}</a></div>${isOpen?kids.map(k=>node(k,ids,depth+1)).join(''):''}`;};
 return GROUP_ORDER.filter(g=>groups[g]).map(g=>{const ids=groups[g];const roots=flat?ids:ids.filter(x=>!ids.includes(parentOf(x)));
  return `<div class="grp"><div class="gh"><span>${esc(gl(g))}</span><span class="mono">${ids.length}</span></div>${roots.map(r=>node(r,ids,0)).join('')}${g==='Campaign'&&!PV()?`<div class="tn" style="--d:0"><span class="tw-sp"></span><a href="#" data-sess="timeline">Timeline</a></div><div class="tn" style="--d:0"><span class="tw-sp"></span><a href="#" data-nav="__journal" aria-current="${S.page==='__journal'}">Player journal <span class="mono muted">${JOURNAL().filter(j=>j.share!=='private').length}</span></a></div>`:''}</div>`;}).join('');}

/* ---------- auto context from the hierarchy ---------- */
function autoContext(id){if(!id||!PAGES[id])return [];const out=[[id,'This page']];const add=(x,why)=>{if(PAGES[x]&&!out.some(o=>o[0]===x))out.push([x,why]);};
 ancestry(id).slice(-2).reverse().forEach(a=>add(a,'Above'));childrenOf(id).forEach(c=>add(c,'Inside'));
 outlinks(id).filter(x=>PAGES[x]&&PAGES[x].type!=='rule').slice(0,6).forEach(x=>add(x,'Linked'));
 backlinks(id).filter(x=>PAGES[x]&&['npc','thread','faction'].includes(PAGES[x].type)).slice(0,4).forEach(x=>add(x,'Links here'));return out;}
function ctxOf(p){const base=autoContext(p.subject||p.parent);(p.extra||[]).forEach(x=>{if(PAGES[x]&&!base.some(b=>b[0]===x))base.push([x,'Added by you']);});return base.filter(([x])=>!(p.exclude||[]).includes(x));}
const ctxIds=p=>ctxOf(p).map(x=>x[0]);

/* ---------- checklist derived from what the proposal fills ---------- */
function subjectsOf(p){const st=STUDIOS[p.studio];if(!st||!st.type)return [];const out=[];
 p.changes.filter(c=>c.op==='newPage'&&c.page.type===st.type).forEach(c=>out.push({name:c.page.title,have:new Set(Object.keys(c.page.f||{}))}));
 if(p.subject&&PAGES[p.subject]?.type===st.type){const have=new Set(Object.keys(PAGES[p.subject].f||{}));p.changes.filter(c=>c.target===p.subject&&c.key&&c.inc).forEach(c=>have.add(c.key));out.push({name:PAGES[p.subject].title,have});}
 if(!out.length)out.push({name:p.title,have:new Set()});
 return out.map(s=>({...s,missing:st.keys.map((k,i)=>[k,st.check[i]]).filter(([k])=>!s.have.has(k))}));}

function renderBuild(){
 const el=$('#build');const p=prop();
 const list=['review','working','accepted'].map(st=>{const xs=PROPS.filter(x=>x.status===st);if(!xs.length)return'';
  return `<div class="eyebrow" style="margin:14px 0 4px">${st==='review'?'Waiting for your review':st==='working'?'In progress':'Accepted'}</div><div class="plist">${xs.map(x=>`<button data-prop="${x.id}" aria-current="${x.id===S.prop&&!S.picking}"><span class="t">${esc(x.title)}</span><span class="o">${esc(STUDIOS[x.studio]?.name||'Free thread')} · ${esc(x.when)}</span></button>`).join('')}</div>`;}).join('');
 let left=`<aside class="pane pane-pad" aria-label="Threads"><button class="btn primary" style="width:100%" data-newthread>New thread</button>${list||'<p class="muted" style="margin-top:12px">No threads yet.</p>'}`;
 if(S.picking||!p){
  const byGroup={};Object.entries(STUDIOS).forEach(([k,s])=>{if(!s.type)return;(byGroup[TYPES[k].group]??=[]).push(k);});
  el.innerHTML=left+`</aside><section class="convo pickwrap" aria-label="What are you making?"><div class="pick-in"><div class="eyebrow">New thread</div><h2 style="font-size:1.7rem;margin:4px 0 4px">What are you making?</h2><p class="muted" style="margin:0 0 16px">The entry type decides the checklist, the co-GM lenses and the page layout it fills. You can still talk freely.</p>
   ${GROUP_ORDER.filter(g=>byGroup[g]).map(g=>`<div class="eyebrow" style="margin:14px 0 6px">${esc(g)}</div><div class="studios">${byGroup[g].map(k=>`<button class="studio" data-studio="${k}"><span class="s-name">${esc(STUDIOS[k].name)}</span><span class="s-blurb">${esc(STUDIOS[k].blurb)}</span></button>`).join('')}</div>`).join('')}
   <div class="eyebrow" style="margin:14px 0 6px">Anything else</div><div class="studios"><button class="studio" data-studio="free"><span class="s-name">Free thread</span><span class="s-blurb">${esc(STUDIOS.free.blurb)}</span></button></div></div></section>
   <aside class="pane pane-pad canvas"><div class="eyebrow">Proposal canvas</div><p class="muted">The canvas fills in once a thread starts.</p></aside>`;
  return;}
 const locked=p.status!=='working';const st=STUDIOS[p.studio]||STUDIOS.free;const ctx=ctxOf(p);
 const needsParent=st.type&&TYPES[st.type].parents?.length&&!p.subject;
 const cands=needsParent?Object.keys(PAGES).filter(x=>TYPES[st.type].parents.includes(PAGES[x].type)):[];
 left+=`<div class="eyebrow" style="margin:22px 0 6px">Context · automatic</div>
  ${ctx.length?`<ul class="ctxlist">${ctx.map(([id,why])=>`<li>${wl(id)} <span class="muted small">${esc(why)}</span>${locked?'':`<button class="btn ghost small" data-unctx="${id}" aria-label="Leave out">×</button>`}</li>`).join('')}</ul>`:'<p class="muted small">Nothing yet. Pick where this goes, or add a page.</p>'}
  ${(p.exclude||[]).length?`<p class="muted small">Left out: ${p.exclude.map(x=>`<a href="#" class="wl" data-reinc="${x}">${esc(PAGES[x]?.title||x)}</a>`).join(', ')}</p>`:''}
  ${locked?'':`<div class="addctx"><input type="text" id="addctx" list="pagelist" placeholder="Add a page…" aria-label="Add a page"><button class="btn" data-addctx>Add</button></div><datalist id="pagelist">${Object.values(PAGES).map(x=>`<option value="${esc(x.title)}">`).join('')}</datalist>`}
  <p class="notice" style="margin-top:12px">Built from where the page sits: the page, what's above and inside it, and its links. The co-GM reads only these, plus the ruleset (${esc(RULESETS[C.ruleset].short)}) and your principles.</p></aside>`;
 const msgs=p.thread.map((m,i)=>`<div class="msg ${m.who}"><div class="who">${m.who==='gm'?'You':'Co-GM'} ${m.lens?`<span class="lens">${esc(m.lens)}</span>`:''}</div><div class="body">${md(m.text)}${m.options?`<div class="opts">${m.options.map((o,j)=>`<button data-opt="${i}:${j}" class="${m.picked===j?'picked':''}" ${m.picked!=null||locked?'disabled':''}>${esc(o.label)}</button>`).join('')}</div>`:''}</div></div>`).join('');
 const steps=['working','review','accepted'],si=steps.indexOf(p.status);
 const subs=subjectsOf(p);
 const checklist=st.type?`<div class="eyebrow" style="margin:0 0 6px">${esc(st.name)} checklist · from the page layout</div>${subs.map(s=>{const n=st.keys.length,done=n-s.missing.length;return `<div class="subj"><div class="row" style="justify-content:space-between"><strong>${esc(s.name)}</strong><span class="mono small">${done}/${n}</span></div><div class="bar"><i style="width:${Math.round(done/n*100)}%"></i></div>${s.missing.length&&!locked?`<div class="chips" style="margin-top:6px">${s.missing.map(([k,l])=>`<button class="chip-btn" data-workon="${esc(l)}" title="Work on this">${esc(l)}</button>`).join('')}</div>`:''}</div>`;}).join('')}<p class="muted small" style="margin:4px 0 0">Ticks itself as the change set fills sections. Click a missing one to work on it.</p>`:'';
 const tests=[...st.tests,...(C.principles||[]).filter(x=>x[1]&&/chokepoint|Legible/.test(x[0])&&!st.tests.some(t=>t.includes(x[0].slice(0,12)))).map(x=>x[0])];
 const chg=p.changes.map((c,i)=>`<div class="chg ${c.inc?'':'off'}"><div class="h"><label><input type="checkbox" data-inc="${i}" ${c.inc?'checked':''} ${p.status==='accepted'?'disabled':''}><span><span class="k ${KIND[c.op][1]}">${KIND[c.op][0]}</span><br>${changeTarget(c)}</span></label></div>
   ${!locked&&!['clock','note','today','session','reveal'].includes(c.op)?`<textarea data-ctext="${i}" aria-label="Edit proposed text">${esc(changeText(c))}</textarea>`:`<div class="prev">${md(changeText(c))}</div>`}</div>`).join('');
 const inc=p.changes.filter(c=>c.inc).length;
 let actions='';
 if(p.status==='working')actions=`<button class="btn primary" data-step="review" ${inc?'':'disabled'}>Prepare for review</button><span class="muted small" style="align-self:center">Nothing reaches the Wiki yet.</span>`;
 if(p.status==='review')actions=`<button class="btn ok" data-step="accept" ${inc?'':'disabled'}>Accept ${inc} change${inc===1?'':'s'} into canon</button><button class="btn" data-step="working">Return to co-creation</button>`;
 if(p.status==='accepted')actions=`<span class="muted small">Accepted ${esc(p.acceptedAt||p.when)}. The Wiki history links back here.</span>`;
 const spoil=p.changes.some(c=>c.op==='reveal')&&p.status!=='accepted'?(()=>{const tg=p.changes.filter(c=>c.op==='reveal'&&c.inc).map(c=>c.target);const pcs=Object.keys(PAGES).filter(x=>PAGES[x].type==='pc');const iss=withReveals(p.changes,()=>spoilers(['party',...pcs],[...new Set(tg)]));return iss.length?`<div class="spoil" style="margin-top:14px"><strong>Spoiler check on these reveals · ${iss.length}</strong><ul>${iss.map(s=>`<li>${esc(PAGES[s.id].title)} · ${esc(s.l)} ${s.msg}</li>`).join('')}</ul></div>`:'<div class="spoil ok" style="margin-top:14px">Spoiler check: these reveals don\'t expose anything players can\'t see.</div>';})():'';
 el.innerHTML=left+`<section class="convo" aria-label="Conversation"><div class="convo-h"><input id="ptitle" value="${esc(p.title)}" aria-label="Thread title" ${locked?'disabled':''}>
   <div class="row"><span class="pill p-${p.status}">${p.status==='review'?'In review':p.status}</span><span class="studio-chip">${esc(st.name)}</span>${p.subject?`<span class="muted small">on ${wl(p.subject)}</span>`:p.parent?`<span class="muted small">under ${wl(p.parent)}</span>`:''}<span class="muted small">· ${esc(p.origin)}</span>${lensesOf(p).length?`<span class="muted small">· Lenses:</span>${lensesOf(p).map(l=>`<span class="lens">${esc(l)}</span>`).join('')}`:''}</div></div>
  <div class="msgs" id="msgs">${msgs}</div>
  <div class="compose">${locked?`<p class="notice">${p.status==='review'?'Frozen for review. Return it to co-creation to keep talking.':'Accepted threads are read-only. Start a new thread to build on it.'}</p>`:
   `<textarea id="gmtext" placeholder="Direct the co-GM: ask for options, push back, add a constraint…" aria-label="Message to the co-GM"></textarea><div class="row"><span class="muted small">Prototype: replies are scripted.</span><button class="btn primary" data-send>Send</button></div>`}</div></section>
  <aside class="pane pane-pad canvas" aria-label="Proposal canvas"><div class="eyebrow">Proposal canvas</div>
   <div class="stepper">${['Working draft','Review','Accepted'].map((s,i)=>`<span class="${i<si?'done':i===si?'on':''}">${s}</span>`).join('')}</div>
   ${needsParent&&!locked?`<label class="lbl" style="margin-bottom:12px">Where does it go?<select id="pparent"><option value="">Choose a ${esc(TYPES[st.type].parents.map(t=>TYPES[t].label.toLowerCase()).join(' or '))}…</option>${cands.map(x=>`<option value="${x}" ${p.parent===x?'selected':''}>${esc(PAGES[x].title)} · ${esc(TYPES[PAGES[x].type].label)}</option>`).join('')}</select></label>`:''}
   ${checklist}
   ${tests.length?`<div class="eyebrow" style="margin:14px 0 4px">Checks the co-GM runs</div><ul class="tests">${tests.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
   ${p.open.length?`<div class="eyebrow" style="margin:14px 0 4px">Open directions</div><ul class="openq">${p.open.map(o=>`<li>${inline(o)}</li>`).join('')}</ul>`:''}
   ${spoil}
   <div class="eyebrow" style="margin:14px 0 6px">Change set · ${inc} of ${p.changes.length} included</div><div class="changes">${chg||'<p class="muted">No changes proposed yet.</p>'}</div>
   <div class="actions">${actions}</div></aside>`;
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
}
function newThread(studio,title,context,thread,changes,origin){const st=STUDIOS[studio]||STUDIOS.free;const ctx=context||[];
 const p={id:'p'+(nextId++),studio,title:title||`New ${st.name.toLowerCase()}`,status:'working',origin:origin||'Worldbuilding',when:'Now',subject:ctx[0]||null,extra:ctx.slice(1),exclude:[],
  thread:thread||[{who:'cogm',lens:st.lenses[0],text:st.type?`${st.name}. Tell me what you have in mind, even one line.${TYPES[st.type].parents?.length&&!ctx[0]?' Pick where it goes on the right and I will read what surrounds it.':''} The checklist on the right comes from the ${st.name.toLowerCase()} layout and ticks itself as we fill it.`:`What do you want to think through? Nothing I draft reaches the Wiki until you accept it.`}],changes:changes||[],open:[]};
 PROPS.push(p);S.prop=p.id;S.picking=false;S.ws='build';render();return p;}

/* ---------- campaign state: clocks from threads, recent events from the one timeline ---------- */
function renderCampaignState(){const p=PAGES['campaign-state'];const threads=Object.entries(PAGES).filter(([,x])=>x.type==='thread');const cl=clocks();
 const recent=TL.filter(e=>!e.past).sort((a,b)=>b.day-a.day).slice(0,8);
 return `<div class="crumbs"><span>${esc(C.name)}</span></div><h1>Campaign State</h1>
  <div class="docbar"><span class="pill p-draft">Live truth</span><span class="pill p-prepared">${esc(RULESETS[C.ruleset].short)}</span><span class="pill p-draft">Today: ${esc(fmtDay(C.today))}</span></div>
  <div class="lead">${inline(p.lead)}</div>
  ${cl.length?`<section class="sec"><h2>Fronts and clocks</h2><div class="cs-clocks">${cl.map(c=>`<div class="cs-clock"><div><b>${wl(c.id)}</b><small>${inline(PAGES[c.id].f?.['Driven by']||'')}</small></div><div>${clockHTML(c.pos)} <span class="mono">${c.pos}/5</span></div><div><small>Next</small>${esc(c.fired||c.portent)}</div></div>`).join('')}</div></section>`:''}
  ${threads.length?`<section class="sec"><h2>Other open threads</h2><div class="tablewrap"><table><thead><tr><th>Thread</th><th>Pressure</th><th>Next beat</th></tr></thead><tbody>${threads.filter(([id,t])=>!t.clock).map(([id,t])=>`<tr><td>${wl(id)}</td><td><span class="pill p-${esc(t.f.Pressure)}">${esc(t.f.Pressure)}</span></td><td>${inline(t.f.next||'')}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  ${CLACK.length?`<section class="sec"><h2>What the party can hear</h2><ul class="clack">${CLACK.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>`:''}
  ${recent.length?`<section class="sec"><h2>Recent events <a href="#" class="wl small" data-sess="timeline" style="font-family:var(--sans);font-size:.85rem;margin-left:8px">Full timeline →</a></h2><ul class="tl-mini">${recent.map(e=>`<li><a href="#" data-event="${e.id}"><span class="mono muted">${esc(fmtDay(e.day))}</span></a><br>${inline(e.text)}</li>`).join('')}</ul></section>`:''}
  ${threads.length?'':`<div class="card empty"><p>This campaign is empty. Start in Worldbuilding: pick what you're making.</p><button class="btn primary" data-ws="build">Go to Worldbuilding</button></div>`}`;}

/* ---------- editor: Parent is a picker limited to allowed parents ---------- */
function renderEditor(p){const fs=fieldsFor(p.type);const T=TYPES[p.type];const cur=parentOf(S.page);const bad=new Set([S.page,...descendants(S.page)]);
 const parentSel=()=>`<select data-ed="Parent"><option value="">None (top level)</option>${Object.keys(PAGES).filter(x=>(T.parents||[]).includes(PAGES[x].type)&&!bad.has(x)).map(x=>`<option value="[[${x}]]" ${cur===x?'selected':''}>${esc(PAGES[x].title)} · ${esc(TYPES[PAGES[x].type].label)}</option>`).join('')}</select>`;
 return `<div class="crumbs"><span>Editing directly · ${esc(T.label)} layout</span></div><h1>${esc(p.title)}</h1>
  <p class="notice">You are the GM, so direct edits become canon when you save. Use <span class="mono">[[page-id]]</span> for links.</p>
  <div class="edgrid"><label class="lbl">Title<input type="text" id="ed-title" value="${esc(p.title)}"></label>
  ${T.parents?.length?`<label class="lbl">Parent<span class="muted small" style="text-transform:none;letter-spacing:0;font-weight:400">A ${esc(TYPES[p.type].label.toLowerCase())} can sit under: ${esc(T.parents.map(t=>TYPES[t].label).join(', '))}</span>${parentSel()}</label>`:''}
  <label class="lbl">Lead<textarea data-ed="__lead" rows="3">${esc(p.lead||'')}</textarea></label>
  ${fs.filter(([k])=>k!=='Parent').map(([k,l,short])=>`<label class="lbl">${esc(l)}${short?`<input type="text" data-ed="${esc(k)}" value="${esc(p.f?.[k]||'')}">`:`<textarea data-ed="${esc(k)}" rows="3">${esc(p.f?.[k]||'')}</textarea>`}</label>`).join('')}</div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" data-save>Save</button><button class="btn" data-cancel>Cancel</button></div>`;}
restore();loadCampaign(CAMPAIGNS.gm?'gm':Object.keys(CAMPAIGNS)[0]);if(S.user)S.ws=S.user.role==='player'?'wiki':'home';render();
</script>
