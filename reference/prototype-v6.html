<title>Grey Marches Designspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#E7EBE6; --surface:#F5F7F3; --surface-2:#DCE2DC; --raised:#FFFFFF;
  --ink:#1B2320; --ink-2:#4B5953; --ink-3:#6F7C76; --line:#C7D0C9; --line-2:#D8DFD9;
  --accent:#2C6A62; --accent-soft:#D3E4E0; --accent-ink:#FFFFFF;
  --ochre:#9E6B1E; --ochre-soft:#F1E3C8;
  --review:#3D5B85; --review-soft:#DCE4F1;
  --ok:#3C7446; --ok-soft:#D8EBDA;
  --danger:#9A3A2D; --danger-soft:#F2DAD5;
  --shadow:0 10px 30px rgba(20,30,26,.14);
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --hdr:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111614; --surface:#171D1A; --surface-2:#212925; --raised:#1D2420;
  --ink:#DCE3DF; --ink-2:#A2AFA9; --ink-3:#7D8A84; --line:#2E3833; --line-2:#262F2B;
  --accent:#74B6AB; --accent-soft:#1F3632; --accent-ink:#0E1512;
  --ochre:#D6A456; --ochre-soft:#3A2F1C;
  --review:#94ADD8; --review-soft:#232E40;
  --ok:#86C08E; --ok-soft:#1E3322;
  --danger:#E0907F; --danger-soft:#3B221D;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111614; --surface:#171D1A; --surface-2:#212925; --raised:#1D2420;
  --ink:#DCE3DF; --ink-2:#A2AFA9; --ink-3:#7D8A84; --line:#2E3833; --line-2:#262F2B;
  --accent:#74B6AB; --accent-soft:#1F3632; --accent-ink:#0E1512;
  --ochre:#D6A456; --ochre-soft:#3A2F1C;
  --review:#94ADD8; --review-soft:#232E40;
  --ok:#86C08E; --ok-soft:#1E3322;
  --danger:#E0907F; --danger-soft:#3B221D;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--hdr);display:flex;align-items:center;gap:16px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;border:0;background:transparent;padding:0}
.brand b{font-family:var(--serif);font-size:1.15rem;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-inline:auto}
.ws button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.ws button[aria-current="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ws .dot{width:8px;height:8px;border-radius:50%}
.ws .n{font-family:var(--mono);font-size:.68rem;background:var(--ochre);color:var(--surface);border-radius:8px;padding:0 6px}
.proto{font-size:.75rem;border:1px dashed var(--ochre);color:var(--ochre);border-radius:999px;padding:2px 10px;white-space:nowrap}
.view{display:none}
.view.on{display:grid}

/* ---------- shared bits ---------- */
.pane{background:var(--surface);overflow:auto;min-width:0}
.pane-pad{padding:18px 16px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 9px;white-space:nowrap}
.p-working{background:var(--ochre-soft);color:var(--ochre)}
.p-review{background:var(--review-soft);color:var(--review)}
.p-accepted,.p-played{background:var(--ok-soft);color:var(--ok)}
.p-prepared{background:var(--accent-soft);color:var(--accent)}
.p-draft{background:var(--surface-2);color:var(--ink-3)}
.p-hot{background:var(--danger-soft);color:var(--danger)}
.p-rising{background:var(--ochre-soft);color:var(--ochre)}
.p-slow,.p-latent,.p-closed{background:var(--surface-2);color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:2px 4px 2px 10px;font-size:.85rem}
.chip button{border:0;background:transparent;color:var(--ink-3);padding:0 6px;border-radius:50%}
.lens{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;white-space:nowrap}
a.wl{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
a.wl:hover{border-bottom-color:var(--accent)}
.wl.un{color:var(--ink-3);border-bottom:1px dashed var(--ink-3);cursor:help}
.clock{display:inline-flex;gap:3px;vertical-align:middle}
.clock i{width:14px;height:9px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.clock i.f{background:var(--ochre);border-color:var(--ochre)}
.clock.full i.f{background:var(--danger);border-color:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.tablewrap{overflow-x:auto}
textarea,input[type=text],input[type=search]{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.5}

/* ---------- WIKI ---------- */
#wiki{grid-template-columns:280px minmax(0,1fr) 300px;height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#wiki>.pane{height:100%}
.tree{border-right:1px solid var(--line)}
.tree .grp{margin-top:14px}
.tree .grp>div.gh{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between}
.tree a{display:block;padding:3px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree a:hover{background:var(--surface-2)}
.tree a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tree .new{color:var(--ok);font-size:.7rem;font-weight:700;margin-left:4px}
.doc{background:var(--bg)}
.doc-in{max-width:1080px;margin:0 auto;padding:26px 28px 80px}
.crumbs{font-size:.85rem;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.doc h1{font-size:2.35rem;line-height:1.1;margin:8px 0 6px}
.aka{color:var(--ink-3);font-style:italic;font-family:var(--serif)}
.docbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.lead{font-family:var(--serif);font-size:1.18rem;line-height:1.55;color:var(--ink)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:18px 0}
.facts dt{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding-top:2px}
.facts dd{margin:0}
.sec{margin-top:26px}
.sec h2{font-size:1.35rem;margin-bottom:6px}
.sec p{margin:.45em 0;max-width:68ch}
.sec ul{margin:.4em 0;padding-left:1.2em;max-width:68ch}
.sec .fresh{border-left:3px solid var(--ok);padding-left:12px}
.ctx h3{font-family:var(--sans);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 6px}
.ctx h3:first-child{margin-top:0}
.ctx ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.92rem}
.ctx .rel{color:var(--ink-3);font-size:.8rem}
.ctx{border-left:1px solid var(--line)}
.hist li{border-left:2px solid var(--line);padding-left:10px}
.hist li.acc{border-left-color:var(--ok)}
.cs-clocks{display:grid;gap:8px}
.cs-clock{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,2fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cs-clock b{font-family:var(--serif);font-size:1.02rem}
.cs-clock small{display:block;color:var(--ink-3)}
.clack li{font-style:italic;font-family:var(--serif);font-size:1.02rem;margin:.35em 0}
.editbox textarea{min-height:420px;font-family:var(--mono);font-size:.85rem}
.treebtn{display:none}

/* ---------- WORLDBUILDING ---------- */
#build{grid-template-columns:270px minmax(0,1fr) 420px;height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#build>.pane{height:100%}
.plist{display:grid;gap:4px}
.plist button{display:grid;gap:3px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px}
.plist button:hover{background:var(--surface-2)}
.plist button[aria-current="true"]{background:var(--raised);border-color:var(--line)}
.plist .t{font-weight:700;line-height:1.25}
.plist .o{font-size:.78rem;color:var(--ink-3)}
.convo{display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
.convo-h{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:grid;gap:6px}
.convo-h input{font-family:var(--serif);font-size:1.35rem;font-weight:700;border:0;background:transparent;padding:0}
.convo-h .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msgs{flex:1;overflow:auto;padding:20px;display:grid;gap:16px;align-content:start}
.msg{max-width:720px}
.msg .who{font-size:.8rem;font-weight:700;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.msg .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msg.gm{justify-self:end}
.msg.gm .who{justify-content:flex-end}
.msg.gm .body{background:var(--accent-soft);border-color:transparent}
.msg .body p{margin:.3em 0}
.msg .body ul{margin:.3em 0;padding-left:1.2em}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opts button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.88rem}
.opts button:hover{background:var(--accent-soft)}
.opts .picked{background:var(--accent);color:var(--accent-ink)}
.compose{border-top:1px solid var(--line);background:var(--surface);padding:12px 20px;display:grid;gap:8px}
.compose textarea{min-height:76px}
.compose .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.canvas{border-left:1px solid var(--line)}
.stepper{display:flex;gap:0;margin:6px 0 14px}
.stepper span{flex:1;text-align:center;font-size:.75rem;font-weight:700;padding:6px 4px;border-bottom:3px solid var(--line);color:var(--ink-3)}
.stepper span.on{color:var(--ink);border-bottom-color:var(--accent)}
.stepper span.done{color:var(--ok);border-bottom-color:var(--ok)}
.chg{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.chg.off{opacity:.5}
.chg .h{display:flex;gap:8px;align-items:flex-start}
.chg .h label{display:flex;gap:8px;align-items:flex-start;flex:1;cursor:pointer}
.chg .h input{margin-top:4px;accent-color:var(--accent)}
.chg .k{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ok)}
.chg .k.upd{color:var(--review)}
.chg .k.clk{color:var(--ochre)}
.chg .prev{font-size:.9rem;color:var(--ink-2);white-space:pre-wrap}
.chg textarea{font-size:.88rem;min-height:70px}
.changes{display:grid;gap:8px}
.openq li{margin:.25em 0;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding-block:10px;border-top:1px solid var(--line)}
.addctx{display:flex;gap:6px;margin-top:8px}
.notice{font-size:.85rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}

/* ---------- SESSIONS ---------- */
#sess{grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - var(--hdr))}
.slib{border-right:1px solid var(--line)}
.slist{display:grid;gap:4px}
.slist button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;align-items:baseline}
.slist button:hover{background:var(--surface-2)}
.slist button[aria-current="true"]{background:var(--raised);border-color:var(--line)}
.slist .num{font-family:var(--mono);font-size:.8rem;color:var(--ink-3);grid-row:span 2}
.slist .t{font-weight:700}
.smain{background:var(--bg);min-width:0}
.smain-in{max-width:1080px;margin:0 auto;padding:22px 24px 80px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.shead h1{font-size:2.1rem;line-height:1.1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;font-weight:700;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:16px}
.sit h2{font-size:1.3rem}
.sit .where{font-size:.85rem;color:var(--ink-3);margin-bottom:8px}
.sit dl{display:grid;gap:8px;margin:10px 0 0}
.sit dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sit dd{margin:0}
.sit dd ul{margin:.2em 0;padding-left:1.1em}
.check label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:.95rem}
.check input{margin-top:5px;accent-color:var(--accent)}
.check label.done span{color:var(--ink-3);text-decoration:line-through}
.suggest{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.table-mode{font-size:1.05rem}
.table-mode details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.table-mode summary{font-family:var(--serif);font-size:1.3rem;font-weight:700;cursor:pointer}
.table-mode details p{margin:.4em 0}
.voices li{margin:.5em 0;list-style:none}
.voices{padding:0;margin:0}
.voices q{display:block;font-family:var(--serif);font-style:italic;color:var(--ink-2)}
.tclock{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.tclock small{color:var(--ink-3);grid-column:1/-1}
.log li{font-size:.9rem;margin:.2em 0}
.lw{display:grid;gap:8px}
.lw .item{display:flex;gap:10px;align-items:flex-start;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lw .item input{margin-top:5px;accent-color:var(--accent)}
.lw .item.q{border-style:dashed;background:transparent}
.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}

/* ---------- peek + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.35);z-index:40}
.peek{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 24px}
.peek h2{font-size:1.6rem;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;z-index:50;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:1px solid var(--bg);color:var(--bg);border-radius:6px;padding:2px 10px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  #build{grid-template-columns:240px minmax(0,1fr);height:auto}
  #build>.pane{height:auto}
  #build .canvas{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .convo{min-height:70vh}
  #wiki{grid-template-columns:240px minmax(0,1fr)}
  #wiki .ctx{grid-column:2;border-left:0;border-top:1px solid var(--line);height:auto}
  #wiki{height:auto}
  #wiki>.pane{height:auto}
}
@media (max-width:820px){
  :root{--hdr:auto}
  .top{flex-wrap:wrap;height:auto;padding-block:8px;gap:8px}
  .ws{order:3;width:100%;margin:0}
  .ws button{flex:1;justify-content:center;padding-inline:6px}
  .brand span{display:none}
  #wiki,#build,#sess{grid-template-columns:minmax(0,1fr)}
  #wiki .ctx{grid-column:auto}
  .tree{border-right:0;border-bottom:1px solid var(--line)}
  .tree.shut .treebody{display:none}
  .treebtn{display:inline-block}
  .doc-in{padding:18px 16px 60px}
  .doc h1{font-size:1.9rem}
  .slib{border-right:0;border-bottom:1px solid var(--line)}
  .smain-in{padding:18px 16px 60px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .cs-clock{grid-template-columns:1fr auto}
  .cs-clock>div:last-child{grid-column:1/-1}
  .convo{border-inline:0}
  .msgs,.compose,.convo-h{padding-inline:16px}
}
@media (prefers-reduced-motion:no-preference){
  .peek{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}

[hidden]{display:none!important}
#home.on{display:block}
.small{font-size:.82rem}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:500}
.chip-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip-s{border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--raised);font-size:.9rem}
.campchip{max-width:260px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem;border-left:1px solid var(--line);padding-left:14px}
.lbl{display:grid;gap:4px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.lbl input,.lbl textarea,.lbl select,.form select{text-transform:none;letter-spacing:0;font-weight:400;font-size:.95rem;color:var(--ink)}
select{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
/* home */

<script>
/* ================= ENTRY TYPES =================
   One taxonomy. Each type defines its layout (info + groups), its allowed parents (the hierarchy),
   and how the co-GM works on it (lenses + quality checks). The checklist in Worldbuilding is the
   type's own section list, so there is nothing separate to maintain. */
const G=(name,fields,gm)=>[name,fields,!!gm];
const TYPES = {
 campaign:{label:'Campaign State',group:'Campaign',fam:'dash',groups:[]},
 arc:{label:'Arc',group:'Threads',fam:'doc',parents:[],kids:'Threads',info:['Phase','Theme'],groups:[
  G('The arc',[['conflict','Core conflict'],['theme','Theme and questions'],['acts','Acts']]),
  G('Stakes',[['unresolved','If unresolved'],['badly','If resolved badly']],1)],
  co:{blurb:'The shape of a campaign act: conflict, theme and stakes.',lenses:['Arc alignment','Lore continuity'],tests:['Player choices must matter']}},
 thread:{label:'Thread / Front',group:'Threads',fam:'front',parents:['arc'],kids:'Clues',info:['Status','Pressure','Driven by'],groups:[
  G('The front',[['impulse','Impulse: why it moves'],['portents','Portents'],['doom','If ignored']]),
  G('At the table',[['signs','Visible signs'],['next','Next beat'],['use','GM use']],1)],
  co:{blurb:'A pressure that moves on its own clock, with portents and a doom.',lenses:['Faction operator','Living world'],tests:['The world does not wait: it has a clock','Legible stakes: every tick has a visible sign']}},
 clue:{label:'Clue / Revelation',group:'Threads',fam:'clue',parents:['thread'],groups:[
  G('The revelation',[['truth','The truth it reveals'],['points','What it points toward']])],
  co:{blurb:'A truth and at least three independent routes to it.',lenses:['Revelation design','Session architecture'],tests:['No chokepoints: three independent routes']}},

 world:{label:'World / Plane',group:'Places',fam:'place',parents:[],kids:'Regions',info:['Type','Parent'],groups:[
  G('Overview',[['description','Description'],['cosmology','Cosmology'],['history','History']]),
  G('Places',[['CHILDREN','Regions']]),
  G('At the table',[['campaign','In this campaign'],['secrets','Secrets']],1)],
  co:{blurb:'The world or plane the campaign lives in.',lenses:['Lore weaving','Lore continuity'],tests:['Label canon, extrapolation and homebrew']}},
 region:{label:'Region',group:'Places',fam:'place',parents:['world','region'],kids:'Places',info:['Type','Parent','Terrain','Climate','Authority','Population','Danger'],groups:[
  G('Overview',[['description','Description'],['history','History']]),
  G('The land',[['geography','Geography'],['climate','Climate and seasons'],['flora','Fauna and flora'],['phenomena','Local phenomena'],['resources','Natural resources']]),
  G('People and powers',[['peoples','Peoples and cultures'],['power','Who holds power'],['CHILDREN','Settlements and sites'],['PEOPLE','People here']]),
  G('Travel',[['routes','Roads and routes'],['hazards','Hazards']]),
  G('At the table',[['impression','First impression'],['now','What is happening now'],['pressures','Creature pressures'],['rumours','Rumours'],['hooks','Hooks'],['secrets','Secrets'],['ignored','If the party does nothing']],1)],
  co:{blurb:'Land, powers, pressures and routes for a whole area.',lenses:['Location design','Lore continuity','Faction operator'],tests:['What happens here if the party does nothing?','Every pressure has a visible sign']}},
 settlement:{label:'Settlement',group:'Places',fam:'place',parents:['region'],kids:'Districts and places',info:['Type','Parent','Population','Governance','Economy','Defence'],groups:[
  G('Overview',[['description','Description'],['history','History']]),
  G('Society',[['demographics','Demographics'],['government','Government'],['culture','Culture and customs'],['religion','Religion'],['factions','Factions and guilds']]),
  G('Economy',[['industry','Industry and trade'],['infrastructure','Infrastructure']]),
  G('Places',[['districts','Districts'],['CHILDREN','Districts and points of interest'],['architecture','Architecture'],['surroundings','Surroundings']]),
  G('Defence',[['defences','Defences']]),
  G('At the table',[['impression','First impression'],['now','Current situation'],['PEOPLE','Notable people here'],['rumours','Rumours'],['hooks','Hooks'],['secrets','Secrets'],['ignored','If the party does nothing']],1)],
  co:{blurb:'Purpose, governance, economy, defence, people and an ongoing problem.',lenses:['Location design','NPC & faction'],tests:['Carry prior business: it has a life without the party']}},
 district:{label:'District',group:'Places',fam:'place',parents:['settlement'],kids:'Places',info:['Type','Parent','Population','Watch'],groups:[
  G('Overview',[['description','Description'],['character','Character'],['history','History']]),
  G('Life here',[['residents','Who lives here'],['factions','Factions and networks'],['CHILDREN','Points of interest']]),
  G('At the table',[['impression','First impression'],['now','Current pressure'],['PEOPLE','Notable people here'],['rumours','Rumours'],['hooks','Hooks'],['secrets','Secrets']],1)],
  co:{blurb:'A quarter of a city with its own character, people and pressure.',lenses:['Location design','NPC & faction'],tests:['Has a current pressure the party can notice']}},
 building:{label:'Building / Landmark',group:'Places',fam:'place',parents:['district','settlement','region'],kids:'Parts',info:['Type','Parent','Owner','Built'],groups:[

 site:{label:'Site',group:'Places',fam:'place',parents:['region','settlement','district'],kids:'Places',info:['Type','Parent','Controlled by'],groups:[

  G('At the table',[['impression','First impression'],['do','What players can do'],['nav','Getting there'],['PEOPLE','Who is here'],['hooks','Hooks'],['secrets','Secrets'],['ignored','If the party does nothing']],1)],
  co:{blurb:'An outdoor or improvised place: a camp, a crossing, a grove.',lenses:['Location design','Scene writing'],tests:['What happens here if the party does nothing?']}},
 dungeon:{label:'Dungeon',group:'Places',fam:'place',parents:['region','settlement','district'],kids:'Levels',info:['Type','Parent','Controlled by','Threat','Level range'],groups:[

  G('Structure',[['approach','Approach'],['logic','Spatial logic'],['CHILDREN','Levels'],['sensory','Sensory details']]),
  G('Occupants',[['inhabitants','Inhabitants'],['factions','Factions inside'],['PEOPLE','Named people here']]),
  G('At the table',[['impression','First impression'],['discoveries','Discoveries'],['hazards','Hazards and tension'],['treasure','Treasure'],['ignored','If the party does nothing']],1)],
  co:{blurb:'A living space with logic, inhabitants, discoveries and consequences.',lenses:['Living dungeon','Encounter design','Rules'],tests:['What happens here if the party does nothing?','No chokepoints: key discoveries have three routes']}},
 level:{label:'Dungeon level',group:'Places',fam:'place',parents:['dungeon','level'],kids:'Sub-levels',info:['Type','Parent','Depth'],groups:[
  G('The level',[['description','Description'],['AREAS','Keyed areas'],['sensory','Sensory details']]),
  G('At the table',[['inhabitants','Who is here'],['hazards','Hazards'],['secrets','Secrets']],1)],
  co:{blurb:'One floor or section of a dungeon, with keyed areas.',lenses:['Living dungeon','Encounter design'],tests:['Every area has something to do or learn']}},

 faction:{label:'Faction',group:'Factions',fam:'faction',parents:['faction','deity'],kids:'Branches',info:['Type','Parent','Leader','Headquarters','Scope','Allies','Rivals','Disposition to party'],groups:[
  G('Overview',[['history','History']]),
  G('Organisation',[['structure','Structure'],['leaders','Leadership'],['MEMBERS','Members'],['resources','Assets and resources'],['territories','Territories']]),
  G('Culture',[['culture','Culture and customs'],['methods','Methods']]),
  G('Relations',[['relations','Relationships']]),
  G('At the table',[['goals','Goals'],['move','Current move'],['hooks','Hooks']],1)],
  co:{blurb:'Goals turned into moves, offers, threats and a clock.',lenses:['Faction operator','NPC & faction'],tests:['The world does not wait: it has a move this arc']}},
 deity:{label:'Deity / Religion',group:'Beliefs',fam:'doc',parents:['deity'],kids:'Deities and orders',info:['Domains','Symbol','Alignment','Holy day','Worshipped by'],groups:[
  G('Faith',[['dogma','Tenets and dogma'],['worship','Worship and rites'],['priesthood','Priesthood'],['holy','Holy sites']]),
  G('Lore',[['myths','Myths'],['history','History']]),
  G('At the table',[['campaign','In this campaign'],['signs','Omens and signs']],1)],
  co:{blurb:'Domains, dogma, worshippers and what faith looks like at the table.',lenses:['Lore weaving','Lore continuity'],tests:['Label canon, extrapolation and homebrew']}},
 culture:{label:'Culture',group:'Beliefs',fam:'doc',parents:['culture'],kids:'Subcultures',info:['Found in','Language','Population','Related faction'],groups:[
  G('Identity',[['values','Values and ideals'],['names','Naming traditions'],['language','Language']]),
  G('Daily life',[['customs','Customs and etiquette'],['dress','Dress'],['food','Food and drink'],['art','Art and architecture']]),
  G('Life and death',[['coming','Coming of age'],['funerary','Funerary customs']]),
  G('Place in the world',[['history','History'],['outsiders','How outsiders see them']]),
  G('At the table',[['campaign','In this campaign']],1)],
  co:{blurb:'Values, customs, names and how others see them.',lenses:['Lore weaving'],tests:['Shows up in play, not only in lore']}},
 lore:{label:'Lore',group:'World',fam:'doc',parents:['lore'],kids:'Events',info:['Kind','When','Where','Involved'],groups:[
  G('The event',[['happened','What happened'],['causes','Causes']]),
  G('Memory',[['believe','What people believe'],['now','Consequences now']]),
  G('The truth',[['truth','The truth'],['leads','Where it leads']],1),
  G('At the table',[['signs','Signs at the table']],1)],
  co:{blurb:'Events, eras and world truths, with belief and truth kept apart.',lenses:['Lore weaving','Lore continuity'],tests:['Belief differs from truth somewhere useful']}},

 npc:{label:'NPC',group:'People',fam:'person',info:['Role','Ancestry','Age','Location','Faction','Status'],triad:[['want','Wants'],['fear','Fears'],['secret','Secret']],groups:[
  G('Description',[['appearance','Appearance'],['personality','Personality']]),
  G('Story',[['who','Who they are'],['history','History']]),
  G('Relationships',[['bonds','Relationships'],['CARRIES','Carries']]),
  G('At the table',[['knows','What they know'],['will','What they will do'],['wont','What they won\'t do'],['hooks','Hooks'],['stats','Stat basis']],1)],
  co:{blurb:'People with wants, fears, voice and business of their own.',lenses:['NPC & faction','Lore continuity','Rules'],tests:['Carry prior business','Voice usable in one line']}},
 pc:{label:'Player character',group:'Party',fam:'person',info:['Player','Class and level','Ancestry','Background','Status'],triad:[['drive','Drive'],['burden','Burden'],['secret','Secret (GM)']],groups:[
  G('Description',[['appearance','Appearance'],['personality','Personality']]),
  G('Story',[['background','Background'],['arc','Arc and open beats']]),
  G('Relationships',[['bonds','Bonds'],['CARRIES','Carries']]),
  G('At the table',[['hooks','Hooks for the GM']],1)]},
 party:{label:'Party',group:'Party',fam:'party',info:['Location','Goal','Reputation'],groups:[
  G('The group',[['bonds','Bonds'],['tensions','Tensions'],['resources','Shared resources'],['secrets','Shared secrets']])]},
 creature:{label:'Creature',group:'Bestiary',fam:'doc',parents:['creature'],kids:'Kinds',info:['Type','CR','Habitat','Stat basis','Rarity'],groups:[
  G('Description',[['appearance','Appearance']]),
  G('Ecology',[['why','Why it is here'],['ecology','Ecology and diet'],['behaviour','Behaviour'],['society','Society']]),
  G('At the table',[['situation','The situation it creates'],['run','How to run it']],1)],
  co:{blurb:'Why it is here, what situation it creates, and how to run it.',lenses:['Lore weaving','Encounter design','Rules'],tests:['Checked against the ruleset\'s monster list']}},
 item:{label:'Magic item',group:'Items',fam:'item',info:['Rarity','Kind','Attunement','Holder'],groups:[
  G('Lore',[['story','Why it matters'],['look','Description'],['history','History']]),
  G('Mechanics',[['effects','Effects'],['rules','Rules basis']]),
  G('At the table',[['found','How it is found or opened'],['pressure','Pressure it creates']],1)],
  co:{blurb:'Story, mechanics and balance checked against the campaign ruleset.',lenses:['Magic item design','Rules','Lore continuity'],tests:['Balanced against the campaign ruleset','The item creates pressure, not only power']}},
 rule:{label:'Rule reference',group:'Rules',fam:'rule',parents:['rule'],kids:'House rulings',info:['Source','Category'],groups:[G('Rule',[['summary','Summary'],['table','At the table']])]},
 ruling:{label:'House ruling',group:'Rules',fam:'doc',parents:['rule'],info:['Parent','Decided','Label'],groups:[G('Ruling',[['ruling','The ruling'],['why','Why']])]},
};
const AUTO=['AREAS','CHILDREN','PEOPLE','MEMBERS','CARRIES'];
Object.values(TYPES).forEach(T=>{T.f=T.groups.flatMap(g=>g[1]);T.glance=T.info||[];if(T.parents&&T.parents.length&&!T.glance.includes('Parent'))T.glance.splice(1,0,'Parent');});
const GROUP_ORDER=['Campaign','Threads','Places','Factions','People','Party','Beliefs','World','Bestiary','Items','Rules'];

/* Worldbuilding studios are derived from the types: one per type that has a co-GM definition, plus a free thread.
   The checklist is the type's own section list. */
const STUDIOS={};
Object.entries(TYPES).forEach(([k,T])=>{if(!T.co)return;const check=[...(T.triad||[]),...T.f.filter(([key])=>!AUTO.includes(key))].map(x=>x[1]);
 STUDIOS[k]={name:T.label,type:k,blurb:T.co.blurb,lenses:T.co.lenses,tests:T.co.tests,check,keys:[...(T.triad||[]),...T.f.filter(([key])=>!AUTO.includes(key))].map(x=>x[0])};});
STUDIOS.free={name:'Free thread',type:null,blurb:'Think out loud without a structure.',lenses:['Supervisor'],check:[],keys:[],tests:[]};
/* ================= RULESETS + CALENDARS ================= */
const RULESETS={dnd2014:{name:'Dungeons & Dragons 5e (2014)',short:'D&D 2014',
 books:[{id:'phb',name:'Player\'s Handbook (2014)',core:1},{id:'dmg',name:'Dungeon Master\'s Guide (2014)',core:1},{id:'mm',name:'Monster Manual (2014)',core:1},{id:'xge',name:'Xanathar\'s Guide to Everything'},{id:'tce',name:'Tasha\'s Cauldron of Everything'},{id:'motm',name:'Mordenkainen Presents: Monsters of the Multiverse'},{id:'ftd',name:'Fizban\'s Treasury of Dragons'},{id:'bgg',name:'Bigby Presents: Glory of the Giants'}],
 pages:{
  'rule-turn-undead':{type:'rule',title:'Turn Undead',f:{Source:'PHB · Cleric (SRD 5.1)',Category:'Class feature',summary:`Channel Divinity. Each undead that can see or hear the cleric within 30 feet makes a Wisdom save; on a failure it is turned for 1 minute or until it takes damage.`,table:`Turned creatures must spend their turns moving away and can't take reactions.`}},
  'rule-arcane-lock':{type:'rule',title:'Arcane Lock',f:{Source:'PHB · Spell (SRD 5.1)',Category:'2nd-level abjuration',summary:`Magically locks a door, window, gate, chest or other entryway until dispelled. Creatures the caster designates can open it normally. Adds 10 to the DC to force it open.`,table:`Knock suppresses it for 10 minutes. Dispel Magic ends it.`}},
  'rule-speak-with-dead':{type:'rule',title:'Speak with Dead',f:{Source:'PHB · Spell (SRD 5.1)',Category:'3rd-level necromancy',summary:`Grants a corpse the semblance of life to answer up to five questions. It knows only what it knew in life and is under no compulsion to be truthful.`,table:`Fails if the corpse was the target of this spell in the last 10 days, or is undead.`}},
  'rule-orc':{type:'rule',title:'Orc',f:{Source:'MM (SRD 5.1)',Category:'Monster · CR 1/2',summary:`Aggressive humanoid raider. Greataxe and javelins; Aggressive lets it dash toward an enemy as a bonus action.`,table:`Good as a scouting party of four to six at party level 3.`}},
  'rule-ogre':{type:'rule',title:'Ogre',f:{Source:'MM (SRD 5.1)',Category:'Monster · CR 2',summary:`Large giant. Heavy greatclub and javelin attacks; slow-witted but hits very hard.`,table:`One ogre with orc support is a hard fight for a level 3 party.`}},
 }}};
const CALENDARS={harptos:{name:'Calendar of Harptos',era:'DR',months:['Hammer','Alturiak','Ches','Tarsakh','Mirtul','Kythorn','Flamerule','Eleasis','Eleint','Marpenoth','Uktar','Nightal']},
 simple:{name:'Simple 12 × 30',era:'',months:['First','Second','Third','Fourth','Fifth','Sixth','Seventh','Eighth','Ninth','Tenth','Eleventh','Twelfth'].map(m=>m+' month')}};
const DAY=(y,m,d)=>y*360+m*30+(d-1);

/* ================= THE GREY MARCHES (sample from the GM vault, Session 04 state) ================= */
function greyMarches(){
const pages={
'campaign-state':{type:'campaign',title:'Campaign State',lead:`Live snapshot after Session 04. The party is at [[callow-cross]] outside The Resting Wheel. [[varik-thorne|Varik]] is one session from Vellumis authority. [[caldrin-holt|Caldrin]]'s inspection is one session from [[ashfen]]. The Hearthbound confrontation is imminent.`},
'campaign-arc':{type:'arc',title:'Campaign Arc: The Witness',gm:true,lead:`The world worsens because it works.`,f:{Phase:'Act I · The Grey Marches',Theme:'Stability vs. humanity',conflict:`The Vale of Thren has been stabilised for generations by [[the-choir]], a soul-powered foresight engine. The price is a growing population of [[persistants]] and a politics that can no longer survive without the system corroding it.`,unresolved:`The Choir grows. Persistants accumulate. Human autonomy ends through the quiet inevitability of a system that works.`,badly:`Foresight collapses without preparation. 137 years of contained conflict releases at once.`}},

'faerun':{type:'world',title:'Faerûn',prov:'Canon',lead:`The world of the campaign. The Vale of Thren sits at the eastern edge of the Dalelands, opening toward the Dragon Reach.`,f:{Type:'Material Plane world',description:`**[Canon]** The Dragon Reach connects the Inner Sea to the Moonsea region, bordered by Scardale, Harrowdale and the Vast.`,campaign:`**[Homebrew]** The Vale predates the Dales compact and has never sought membership. It exists beside the eastern Dalelands without displacing them.`}},
'vale-of-thren':{type:'region',title:'The Vale of Thren',lead:`A fertile and prosperous region known for its stability. While other lands struggle with war, succession crises and famine, Thren has enjoyed long periods of peace, predictable governance and reliable trade.`,f:{Type:'River valley realm',Parent:'[[faerun]]',Authority:'The Concord; the Augural Conclave in [[vellumis]]',Terrain:'Fertile river valley opening toward the Dragon Reach',description:`People in the Vale value continuity over ambition. Change is viewed with caution. When conflicts arise, they are usually resolved early, before they spread or turn violent.\n\nMany attribute this to good leadership, careful planning and the guidance of respected institutions. Others call it good fortune.`,peoples:`A common saying, when something goes wrong but stops short of disaster: *"At least it was handled."* Most mean it as reassurance.`,power:`- [[vellumis]], seat of administration and the Grand Augur\n- Harthvale, the agricultural and military backbone\n- Kethyr Reach, mercantile city-states and ports\n- [[grey-marches]], the outer borderlands`,secrets:`This is the public, civic-facing description. The underside ([[the-choir]], the Witness, [[persistants]]) is intentionally absent. See [[campaign-arc]].`}},
'grey-marches':{type:'region',title:'The Grey Marches',aliases:['The Vhaelen March'],lead:`The outer borderlands of the [[vale-of-thren]]. Not wild but neglected: a region that was administered and then underfunded, where the infrastructure of civilisation is present but quietly failing.`,f:{Type:'Borderland',Parent:'[[vale-of-thren]]',Terrain:'Scrubby moorland, river valleys, old trade roads',Climate:'Wet, windy, grey',Authority:`[[edrienne-vale]] in name; [[caldrin-holt]] in practice`,Danger:'Rising',description:`Governance is weaker here, resources thinner and authority more fragmented. The Marches are large; the party will only see parts of them in Act I.`,geography:`Scrubby moorland cut by river valleys and old trade roads, with forested ridgelines to the north and east. Long sight lines broken by gorse and dry-stone walls.`,phenomena:`Kelemvorite death rites no longer work reliably here. Undead persist longer and reform more stubbornly. See [[ruling-turn-undead]].`,flora:`- [[gnolls-eastern-road]]\n- A young dragon, Virethax, consolidating the ridgeline\n- Sunder, a manticore that has taken four Warden patrol members in eight months`,power:`- [[marchwardens]], under [[caldrin-holt]]\n- [[hearthbound]], dispersed and armed\n- [[bonewrights]], officially nonexistent\n- [[quiet-roads]], watching`,routes:`The main road runs east–west through [[callow-cross]]. The Y junction road leads toward the Wardhold and Vellumis.`,hazards:`Gnoll ambushes on the eastern road; orc war-scouts pushed west from the high moor.`,impression:`Long sight lines broken by gorse. Roads that nobody maintains. Villages that stop talking when a Warden patrol rides in.`,now:`Three pressures are moving at once. **Caldrin's consolidation** is accelerating. **The transport pipeline is exposed** at several points. **The Quiet Roads are watching** the party.`,pressures:`- Virethax is displacing owlbears, a basilisk and a wyvern pair toward lower ground\n- Sunder's bounty is unclaimed; Caldrin may pull two patrols to hunt it\n- The gnoll third warband is moving further west than gnolls normally range`,hooks:`- Someone is leaving slaughtered livestock at the edge of the Marches\n- [[iron-works]] is buying grain and lamp oil in volume`,ignored:`A village will be "resolved" within two sessions whether or not the party intervenes. What changes is the terms.`}},
'callow-cross':{type:'settlement',title:'Callow Cross',lead:`A crossroads settlement in the eastern [[grey-marches]]. The faction-neutral hub of the Marches. Everything passes through here eventually.`,f:{Type:'Crossroads hamlet',Parent:'[[grey-marches]]',Population:'A few dozen, plus travellers',Governance:'None formal; [[maret-holwick]] in practice',Economy:'The inn',Defence:'None. Neutrality is the defence',description:`Built at the junction of two secondary roads. Neither is significant alone; together they form the primary inland route between the Marches interior and the main road network. Flat moorland, open sightlines in all directions. Not defensible, not resource-rich and not beautiful. It exists because stopping was necessary and someone built something to stop at.`,history:`The inn came first; everything else exists to serve it. The inn is what made this a place rather than a landmark.`,government:`None formal. The March-Regent's authority is recognised in principle and exercised nowhere near here. [[maret-holwick]] runs the settlement by controlling the only place everyone needs to be. She can make the inn stop working for someone, and everyone knows it.`,culture:`A neutrality mandate that works as a social contract: you do not ask where someone has been. Violating it marks you.`,factions:`- [[quiet-roads]]: primary Marches waypoint; the milestone is their message board\n- [[marchwardens]]: pass-through patrols, no permanent post\n- [[bonewrights]]: courier traffic; Maret takes their coin and asks nothing\n- [[hearthbound]]: families in transit, at odd hours\n- The Redstone Company: 24 hobgoblin mercenaries camped two miles east`,industry:`The inn is the economy. The trading post handles lamp oil, salt, rope and grain. Holt's smithy does secondary trade, and his unlisted concealment work for the Quiet Roads is his best-paid.`,infrastructure:`An inn, a smithy, a farrier's, a trading post, three houses and a storage barn the Quiet Roads use as a safe stop.`,defences:`No wall, palisade or ditch. Four factions would each lose something if Callow Cross became hostile ground; that is the defence.`,impression:`Woodsmoke, old wool and something long-cooked. The kind of clean that happens when cleanliness is a professional strategy.`,now:`A Marchwarden patrol is overdue. Two Quiet Roads wagons with hidden compartments are in Holt's stable. [[eave]] is watching the Redstone Company and has not moved yet.`,rumours:`- "Warden patrol has been sitting outside Ashfen for two days with a writ."\n- "The old Iron Works has been buying grain and lamp oil in volume."`,secrets:`[[holt-carver|Holt Carver]] has fifteen years of concealment work for the Quiet Roads behind him.`,ignored:`The Redstone Company moves east in two sessions. The gnolls hit the road to the Y junction. Maret closes the inn to non-regulars.`}},
'resting-wheel':{type:'building',title:'The Resting Wheel',lead:`The inn at [[callow-cross]]. The oldest and largest structure at the crossroads, and the reason it is a place at all.`,f:{Type:'Inn',Parent:'[[callow-cross]]',Owner:'[[maret-holwick]]',description:`Two storeys, a wide common room, rooms upstairs for repeat customers. The food is good. [[maret-holwick|Maret]] understands that comfort makes people careless.`,purpose:`Neutral ground. Every faction in the Marches needs somewhere to stop where nobody asks questions.`,layout:`- Common room with a private back-corner table\n- Upper rooms, including the one [[eave]] rents between runs\n- Stable, where Caelum's rally mark is cut into the south-facing post`,sensory:`Woodsmoke, old wool, something long-cooked. Conversations kept at a volume that doesn't carry.`,impression:`Carters, couriers eating in silence, and a corner table where a dwarf buys the room a round.`,hooks:`- Malketh's note is behind the bar\n- A Crimson Oath rally mark in the stable, cut not chalked`}},
'milestone':{type:'building',title:'The Callow Cross milestone',lead:`The stone at the junction. Its notches change every season.`,f:{Type:'Landmark',Parent:'[[callow-cross]]',description:`Notches cut into two faces at waist height. Regulars know what they mean.`,history:`The notches are cut over an older mark that is still faintly visible in certain light.`,secrets:`The notches are [[quiet-roads]] route markers.`}},
'vellumis':{type:'settlement',title:'Vellumis',lead:`The heart of the [[vale-of-thren]] and the city the party fled. It works too well: problems are processed before most citizens learn their names.`,f:{Type:'City',Parent:'[[vale-of-thren]]',Governance:'Civic administration; the Augural Conclave',description:`Clean avenues, ordered queues, maintained stonework, and officials who arrive quickly when order is disturbed.`,districts:`- Conclave Heights\n- Ledgerward\n- Bellmarket\n- Stillwater Quarters\n- Outer Registries\n- The Underbelly (Low Wards)`,factions:`Split on [[persistants]]: some treat them as free labour and supply the pipeline; others oppose it on principle.`,impression:`Bells, clerks, patrol steps, and market calls kept inside acceptable volume. Wax, ink, wet stone, bread, and smoke kept away from respectable streets.`,hooks:`- Investigate civic records, warrants, grave signatures and transport orders\n- Follow the pipeline toward [[grey-marches]]`}},
'conclave-heights':{type:'district',title:'Conclave Heights',lead:`Administrative district of [[vellumis]], built on a natural rise above the rest of the city. Broad steps, maintained stonework, open plazas.`,f:{Type:'Administrative, political',Parent:'[[vellumis]]',character:`The place where civic authority is made visible, and where most of what matters is decided in rooms the public cannot enter.`,residents:`Human majority; half-elves and elves in advisory and archival roles; rarely anyone from the Low Wards unless they have business.`,now:`A labour-rights petition has collected significant signatures. The Augural Conclave has begun mapping its organisers.`}},
'ledgerward':{type:'district',title:'Ledgerward',lead:`Records district of [[vellumis]]. Record halls, licensing courts and administrative offices. Lines move. Clerks are polite and tired.`,f:{Type:'Records, courts, offices',Parent:'[[vellumis]]',character:`Everything in Vellumis that officially exists exists because Ledgerward wrote it down.`,impression:`Ink, wax and old paper.`,now:`Mortality records have quietly started to include "administrative reassignment" as a cause of death, a category that did not exist two years ago.`}},
'bellmarket':{type:'district',title:'Bellmarket',lead:`Commercial district of [[vellumis]]. Guild halls, counting houses, inns and open markets. Bells mark the opening and closing of trade.`,f:{Type:'Commerce, guilds, trade',Parent:'[[vellumis]]',character:`The loudest, most confident district in the city, and the one where the city's real priorities are easiest to read.`,now:`A guild dispute over Low Wards labour: the Chains undercut guild wages through unregistered labour pools.`}},
'stillwater':{type:'district',title:'Stillwater Quarters',lead:`Residential district of [[vellumis]]. Modest homes, shared courtyards, schools and neighbourhood shrines.`,f:{Type:'Residential',Parent:'[[vellumis]]',character:`When something goes wrong, authorities respond quickly, which most residents find reassuring until it involves their own household.`,now:`A family was quietly "processed" six weeks ago. The neighbours' civic inquiry was closed without explanation.`}},
'outer-registries':{type:'district',title:'Outer Registries',lead:`Gate district of [[vellumis]]. Warehouses, transit halls and processing offices near the city gates.`,f:{Type:'Transit, warehouses, intake',Parent:'[[vellumis]]',character:`Where problems arriving from outside are handled before they reach the rest of the city. Most residents have no reason to visit. That is not an accident.`,secrets:`Persistant transport documentation is processed here rather than in [[ledgerward]], keeping it out of the full public record.`}},
'low-wards':{type:'district',title:'The Underbelly (Low Wards)',aliases:['Low Wards','The Underbelly'],lead:`Crowded streets, ageing tenements and inconsistent services in [[vellumis]]. Guards appear mainly when unrest threatens to spill outward.`,f:{Type:'Poor quarter',Parent:'[[vellumis]]',Watch:'The Lower Watch (unofficial)',character:`Community matters. Neighbours rely on one another for food, childcare, protection and information. People here notice patterns others miss, because they live with the consequences first.`,factions:`- The Roots: food, shelter, burial and order for those the city ignores
- The Sootwalkers: a rooftop youth network
- The Chains: organised crime`,impression:`Narrow streets, washing lines, the smell of the Community Kitchen at midday.`}},
'community-kitchen':{type:'building',title:'The Community Kitchen',lead:`Food, labour postings and the Low Wards' best rumour exchange.`,f:{Type:'Kitchen and meeting hall',Parent:'[[low-wards]]',Owner:'The Roots',purpose:`Feeds whoever comes. The noticeboard is the district's job market.`}},
'chapel-quiet-passing':{type:'building',title:'Chapel of the Quiet Passing',lead:`Free burials for the uncounted dead of the Low Wards.`,f:{Type:'Chapel',Parent:'[[low-wards]]',Owner:'[[thane-wolft]]',purpose:`Buries the people the city doesn't count.`}},
'geoffrey-erheart':{type:'npc',title:'Geoffrey Erheart',aliases:['The Caretaker'],lead:`A Low Wards fixture with no formal authority, whose leadership everyone recognises. His methods are not entirely clear.`,f:{Role:'Low Wards caretaker; party patron',Location:'[[community-kitchen]]',Status:'Ally',want:`Tren recovered; the Persistant situation understood.`}},
'thane-wolft':{type:'npc',title:'Thane Wolft',lead:`Cleric of the Chapel of the Quiet Passing.`,f:{Role:'Cleric',Location:'[[chapel-quiet-passing]]',want:`Understand the divine-and-necrotic signature on the graves.`}},
'hessa-vorn':{type:'npc',title:'Lieutenant Hessa Vorn',lead:`Commands the Wardhold for the [[marchwardens]].`,f:{Role:'Wardhold commander',Faction:'[[wardhold-garrison]]',want:`The order Caldrin is building.`,secret:`Knows what [[caldrin-holt|Caldrin]] is. Doesn't care.`}},
'wardhold-garrison':{type:'faction',title:'The Wardhold garrison',lead:`Field command of the [[marchwardens]], and the part of the coalition most loyal to [[caldrin-holt]].`,f:{Type:'Branch',Parent:'[[marchwardens]]',Leader:'[[hessa-vorn]]',Headquarters:'The Wardhold',move:`Issued the [[ashfen]] inspection order.`}},
'ashfen':{type:'settlement',title:'Ashfen',lead:`A [[hearthbound]] village in the eastern [[grey-marches]]. It has refused a Marchwarden inspection.`,f:{Type:'Village',Parent:'[[grey-marches]]',Population:'About 150',Governance:'Village elder, [[corvin-dast]]',Defence:'Gate closed; some villagers armed',description:`Stone and old timber on a slow river, built the way communities build when they plan to stay. A mill. A chapel. A village green centred on a large ash tree that predates any living resident.`,history:`Hearthbound for at least two generations. Two years ago [[sera-dast|Sera Dast]] died in an altercation with a Warden patrol and returned three weeks later. Someone reported her to the Wardhold by name. The village does not know who.`,demographics:`Three [[persistants]] live here openly: one works the mill, one tends the graveyard, and Sera Dast.`,religion:`The chapel hasn't had a visiting cleric in three years. The village keeps its dead; see [[hearthbound-custom]].`,impression:`Everyone is slightly too aware of strangers. Not hostile. Watchful, in the way of people who have learned that strangers bring consequences.`,now:`The inspection order came from the Wardhold. [[caldrin-holt|Caldrin]] arrives within a day of any refusal. Quill arrived four days ago and argues for open resistance.`,secrets:`A fourth Persistant is hidden: [[gella-murst|Gella Murst]], deteriorating, kept in Corvin's cellar by day. Only five people know. It is the real reason the inspection matters.`,ignored:`Caldrin makes Ashfen his demonstration. The terms depend on who else is at the gate.`}},
'morvaines-holdout':{type:'site',title:`Morvaine's Holdout`,lead:`[[caera-morvaine]]'s makeshift forest settlement near the Y junction.`,f:{Type:'Forest waystation',Parent:'[[grey-marches]]','Controlled by':'[[caera-morvaine]]',description:`Many [[persistants]] live here, cared for rather than caged.`,inhabitants:`- [[caera-morvaine]] and her fighters\n- [[tren-washolt|Tren Washolt]], [[nolva-mast|Nolva Mast]] and [[sem-torrold|Sem Torrold]], in her care`,nav:'Off the road near the Y junction. Found only with Caera as a guide.'}},
'iron-works':{type:'site',title:'The Iron Works',lead:`The downstream destination of the Persistant pipeline. Not yet found by the party.`,f:{Type:'Works on the eastern route',Parent:'[[grey-marches]]',description:`Carters say it has been buying grain and lamp oil in volume, more than any repair work would need.`,secrets:`[[maret-holwick|Maret]] knows what it actually does and has never traded it.`}},
'the-scarrow':{type:'dungeon',title:'The Scarrow',lead:`An abandoned village on a limestone ridge. The [[bonewrights]]' largest active operation in the Marches. The party should not find this easily.`,f:{Type:'Abandoned village',Parent:'[[grey-marches]]','Controlled by':'[[bonewrights]] via [[ossuary-savant]]',Threat:'Social first, then guards','Level range':'3–5',premise:`A research operation hiding inside a dead village.`,history:`Evacuated seven years ago after a "Persistant incident" that was manufactured to clear the site. See [[scarrow-evacuation]].`,impression:`Chalk dust and lime. Faintly sweet in a way that takes a moment to identify as controlled decomposition. Something repetitive in the background: a Persistant performing an assigned task.`,approach:`From the road it looks empty. Up close: fresh wheel ruts, light behind shuttered windows. The lime-kiln smell arrives before the buildings do.`,logic:`Eight stone buildings, three in use. Clinical organisation inside. An academic workspace, not a lair.`,sensory:`Examination tables. Chalk annotations on the walls. Records pinned in order. Nothing here looks like violence. That is part of what makes it wrong.`,inhabitants:`- [[ossuary-savant]], mid-session in the main hall\n- Three [[persistants]]: two assigned tasks, one newly collected\n- A few paid guards`,discoveries:`- The procurement ledger ([[valcerin-entry]])\n- Two seasons of neck-wound notes ([[neck-wound]])\n- Augural Conclave subject-classification notation`,hazards:`[[caldrin-holt]] arrives mid-investigation with six riders to deliver a subject. Ten-minute handover.`,ignored:`The pipeline continues unobserved. The Savant's field data clock keeps moving.`}},
'scarrow-village':{type:'level',title:'The Scarrow: the village',lead:`The ridge road and the eight stone buildings above ground. Three are in use.`,f:{Type:'Surface',Parent:'[[the-scarrow]]',Depth:'Ground',description:`An academic workspace, not a lair. Examination tables, chalk annotations, records pinned in order.`},
 areas:[{n:'1',a:'Ridge road',t:'Wheel ruts, lime smell. Open ground; anyone approaching is visible from the hall.'},{n:'2',a:'Village hall',t:'The Savant\'s workspace. Examination tables, chalk annotations on the walls, records pinned in order.'},{n:'3',a:'Records room',t:'The procurement ledger, the wound documentation folder, Conclave notation.'},{n:'5',a:'Empty houses',t:'Five unused buildings. Cover for watching the hall or hiding from Caldrin\'s column.'}]},
'scarrow-cellars':{type:'level',title:'The Scarrow: the cellars',lead:`Under the village hall. Where the subjects sleep.`,f:{Type:'Cellars',Parent:'[[the-scarrow]]',Depth:'Below ground',description:`Calm, ordered, locked from outside.`},
 areas:[{n:'4',a:'Cellars',t:'Where the subjects sleep. Calm, ordered, locked from outside.'}]},
'marchwardens':{type:'faction',title:'Marchwardens',lead:`Fragmented militia coalition under a shared banner. Closer to a mutual-aid pact than an army.`,f:{Type:'Militia coalition',Leader:'[[caldrin-holt]] (de facto)',Headquarters:'The Wardhold',Scope:'The Grey Marches',Rivals:'[[hearthbound]]','Disposition to party':'Hostile',public:`Protectors of frontier order. The thin line between the Vale and what the Vale doesn't want to see.`,hidden:`Increasingly under the pull of [[caldrin-holt]], a Persistant. Officers reorganise around his methods because his methods work.`,willdo:`Burn a Hearthbound barn, conscript locals, "lose" a Bonewright researcher in transit, lie to the Regent.`,wont:`Operate openly under direct Augural Conclave eyes. They know they cannot survive scrutiny.`,structure:`8–12 banded patrols with no central keep. Field command at the Wardhold; administrative staging at Dunmore's Rest.`,leaders:`- [[caldrin-holt]], captain (de facto)\n- [[hessa-vorn|Lieutenant Hessa Vorn]], the Wardhold\n- [[aldric-vess|Aldric Vess]], on the Lime-Master's payroll`,members:`About 300 active. Mostly veterans, third sons and ex-mercenaries.`,resources:`Poor on paper. Quietly subsidised by Mercantile League interests who want the roads safer.`,territories:`A network of fortified inns, watch-cairns and converted barns along the Marchroads.`,goals:`**Short-term:** suppress Persistant incidents before [[vellumis]] notices.\n**Long-term:** become the formal regional security apparatus.`,move:`Organising the [[ashfen]] inspection; pursuit of the party pending Varik's return.`}},
'hearthbound':{type:'faction',title:'Hearthbound Communities',lead:`A loose network of rural villages bound by a shared practice. See [[hearthbound-custom]].`,f:{Type:'Village network',Leader:'None; Mother Vesna Orr speaks for the eastern hearths',Scope:'The Grey Marches and the Vale',Rivals:'[[marchwardens]], [[bonewrights]]','Disposition to party':'Wary, situationally allied',public:`Pious country folk who care for their elders, even after death. Old custom. Harmless.`,hidden:`Persistants who are welcomed stay calm, and the communities have begun to organise. Some are now armed.`,willdo:`Lie to authority, ambush an inspection, burn their own barn to deny evidence.`,wont:`Hand over a Persistant they have named as kin. There is no price for this.`,structure:`No fortifications. Dispersal is the defence; losing one village does not weaken the network.`,leaders:`- Mother Vesna Orr, eldest of the eastern hearths\n- Brother-Pyre Halden, travels between villages\n- "Quill", young and radical`,members:`Several thousand across dozens of settlements. Perhaps a tenth are organised.`,culture:`Recruitment is grief. Betrayal means excommunication: the traitor's dead are not kept.`,move:`Hardening [[ashfen]] and two other villages against Warden entry.`}},
'caldrin-holt':{type:'npc',title:'Caldrin Holt',aliases:['The Pacifier'],lead:`Effective ruler of [[grey-marches]] in all but title. A [[persistants|Persistant]], though most who serve under him do not know this.`,f:{Role:'De facto Warden captain',Location:'Converging on [[ashfen]]',Faction:'[[marchwardens]]',Status:'Active',want:'Control of the Marches as a commercial and political fiefdom.',fear:'Being recognised as a monster by people who cannot yet stop him.',secret:'He is a Persistant. He supplies the Savant with subjects.',voice:`Short, formal, soldier's cadence. Pauses where a living man would breathe. Left hand gloved; he does not remove it.`,personality:`Preternaturally calm under fire. Never sleeps, never panics. Treats handing over a person like filing a form.`,who:`Rotates between fortified inns along the Marchroads. He wants power that looks like administration from a distance.`,bonds:`- [[hessa-vorn|Hessa Vorn]] knows what he is and doesn't care\n- [[edrienne-vale]] tolerates him\n- [[ossuary-savant]] pays for access`,will:`- "Pacify" a village and issue resolution notices\n- Supply [[ossuary-savant]] with subjects\n- Accelerate when ignored`,wont:`Accept a public loss in front of witnesses. He frames a defeat as a withdrawal.`}},
'caera-morvaine':{type:'npc',title:'Caera Morvaine',lead:`Elf field operative. Pulls [[persistants]] out of the pipeline before they reach [[iron-works]].`,f:{Role:'Field associate to the Regent',Ancestry:'Elf',Location:'[[morvaines-holdout]]',Faction:'[[hearthbound]] ally',Status:'Party ally',want:'Allies who can move openly where her operation cannot.',fear:'Her Caldrin calculation is already past the point of correction.',secret:`Edrienne does not know the extent of her Hearthbound alignment.`,who:`Has worked the Marches longer than most people have been alive.`,history:`She and [[alric-valcerin|Lord Alric Valcerin]] were political peers. She was in the Marches when he was assassinated and has done his work here since.`,will:`Gave [[terena|Terena]] her father's sealed lockbox, [[alric-lockbox]].`,wont:`Accept anyone treating Persistants as cargo. The conversation ends.`}},
'maret-holwick':{type:'npc',title:'Maret Holwick',lead:`The primary information node of the Grey Marches. Not an ally, not an enemy: a reliable transaction.`,f:{Role:'Innkeeper, [[resting-wheel]]',Ancestry:'Human',Age:'Fifties',Location:'[[callow-cross]]',Status:'Neutral',want:'The inn to keep working.',fear:'The Marches destabilising past the point where neutrality is viable.',secret:`Knows what [[iron-works]] actually does. She has never traded this.`,voice:`I don't ask what people are carrying. I also don't ask why a Vellumis rider didn't stop for food.`,appearance:`Broad, unhurried.`,personality:`A warmth that is practised and genuine at the same time. Misses nothing. Mentions only what she chooses to. Sometimes answers a question before it is asked.`,history:`Has run the inn for twenty-five years and outlasted three Warden commanders, two Mercantile factors, one Bonewright bribe and a Conclave informer she turned away at the door.`,knows:`- [[quiet-roads]] routes and schedules\n- Which Wardens are on private payrolls\n- The rough location of [[the-scarrow]]`,wont:`Trade anything that makes the inn stop working. Not a moral position; a professional one.`}},
'ossuary-savant':{type:'npc',title:'The Ossuary Savant',aliases:['Gavril Mourne','The Lime-Master'],lead:`The Vale's most dangerous living scholar of [[persistants]], and the only one on nobody's payroll.`,f:{Role:'Independent researcher',Location:'A converted lime-kiln west of Three-Stones',Faction:'Adjacent to the [[bonewrights]]',Status:'Active',want:'A complete theory of Persistant emergence.',fear:'Becoming an instrument.',secret:`His procurement arrangement with [[caldrin-holt]].`,voice:`You've seen one up close. I can tell by how you're looking at my work. Sit down. I'd like your account.`,appearance:`Wears no Bonewright marks. Dresses like a midwife. Hands stained with chalk and silver nitrate.`,personality:`Measured, never rushed. Asks the question you wish you'd thought of, then answers it before you can.`,will:`Manufacture an incident. He has done this twice before.`}},
'eave':{type:'npc',title:'Eave',aliases:['Blue'],lead:`[[quiet-roads]] Carrier. Will move families out of [[ashfen]] if the inspection turns violent.`,f:{Role:'Carrier',Ancestry:'Half-elf',Age:'28',Location:'[[resting-wheel]]',Faction:'[[quiet-roads]]',want:'The Ashfen spur to hold long enough to move everyone who needs moving.',fear:'Being forced to choose sides before she is ready.',voice:`I have a message I don't understand. Someone working the Hearthbound question might need it.`,history:`Came to the Quiet Roads at nineteen through debt: a favour, then a larger favour.`}},
'foss-ember':{type:'npc',title:'Foss Ember',lead:`Buys a round for every table, every night, whether he can afford it or not.`,f:{Role:'Retired merchant',Ancestry:'Dwarf',Age:'61',Location:'[[resting-wheel]], corner table',want:'To die at this inn at a ripe old age.',fear:'The roads closing.',voice:`Chalk-handed scholar out of the old Scarrow, three seasons now. Pays fair for accounts of the returned.`,history:`Has not completed his planned departure from the Marches in twelve years.`,knows:`The old [[iron-works]] supply route, from before it shifted three years ago.`}},
'myrkul':{type:'deity',title:'Myrkul',gm:true,prov:'Canon + Homebrew',lead:`One of the Dead Three. Slain in the Time of Troubles and since returned, but not at the power he once held. Sealed until Act IV.`,f:{Domains:'Death, decay, old age, exhaustion, dusk, autumn','Worshipped by':'Not established in this campaign',dogma:`**[Canon]** His domain is souls in transition and the knowledge the dead carry. The dead pass through his realm as information.`,history:`**[Canon]** One of three mortals who claimed part of Jergal's portfolio. Kelemvor now holds the judicial role over the dead, and the two domains overlap badly.`,campaign:`**[Homebrew]** The Restoration Project. The party meets its consequences, through [[the-choir]] and [[iron-works]], long before they meet his name.`}},
'hearthbound-custom':{type:'culture',title:'Hearthbound custom',lead:`An old rural practice in the Marches and the Vale: the dead are kept, not surrendered.`,f:{'Found in':'Villages of [[grey-marches]]','Related faction':'[[hearthbound]]',values:`Kin is kin, before and after death.`,customs:`A returned person is welcomed home and given back their old work. Naming a Persistant as kin is a binding act.`,funerary:`The dead are kept. A traitor's dead are not, which to the Hearthbound is a death beyond death.`,outsiders:`To Vellumis, harmless piety. To the [[marchwardens]], a hiding place.`,campaign:`The practice is what the [[hearthbound]] faction organises around. See [[ashfen]].`}},
'gnolls-eastern-road':{type:'creature',title:'Gnolls of the eastern road',lead:`Warbands that have raided the March for generations, drawn west by Yeenoghu's hunger.`,f:{Type:'Humanoid (gnoll)',CR:'1/2; leader CR 4','Stat basis':'MM gnoll; Fang of Yeenoghu',Habitat:'The open moor',why:`Reduced Warden presence has made the eastern roads more dangerous. A third, larger warband has arrived, led by a Fang of Yeenoghu.`,behaviour:`They don't hold territory. They move, kill, eat, and move again.`,situation:`Three ambushes on the eastern road in the last month. Merchants are refusing the run.`,run:`Someone is leaving slaughtered livestock at the edge of the Marches as an offering. Who, and why, is not established.`}},
'alric-lockbox':{type:'item',title:`Alric's sealed lockbox`,lead:`A magically sealed wooden lockbox. Alric gave it to [[caera-morvaine]] shortly before his assassination, with instructions it reach his daughter.`,f:{Rarity:'Not decided',Kind:'Wondrous item (container)',Attunement:'Not decided',Holder:'[[terena]]',story:`It is the last thing Alric meant for [[terena|Terena]]. Nobody knows what is inside.`,look:'Plain wooden lockbox. The seal is magical and unbroken.',pressure:'Held by Terena since Session 04.'}},
'scarrow-evacuation':{type:'lore',title:'The Scarrow evacuation',lead:`Seven years ago the village on the limestone ridge was emptied.`,f:{Kind:'Event',When:'1485 DR',Where:'[[the-scarrow]]',Involved:'[[bonewrights]]',happened:`The [[bonewrights]] manufactured a Persistant incident to clear the site. It worked.`,believe:`The official record cites a Persistant incident. The story was specific enough that nobody went back to loot.`,now:`The site became the Bonewrights' largest active operation in the Marches.`}},

'varik-regroups':{type:'thread',title:'Varik Regroups',clock:{pos:5,portent:`Pursuit order; wanted posters`},lead:`[[varik-thorne]] rides for [[vellumis]] to account for the failed transport. His report puts the party's faces on warrants.`,f:{Parent:'[[campaign-arc]]','Driven by':'[[varik-thorne]]',Status:'open',Pressure:'hot',impulse:`He must explain the failed convoy without becoming the scapegoat.`,doom:`The party become regional fugitives with no safe ground.`,next:`Warrants reach the Marches in Session 05.`}},
'caldrins-grip':{type:'thread',title:`Caldrin's Grip`,clock:{pos:4,portent:`Ashfen inspection forces confrontation`},lead:`[[caldrin-holt]] is becoming the de facto authority of [[grey-marches]] by solving problems faster than legitimate authority can.`,f:{Parent:'[[campaign-arc]]','Driven by':'[[caldrin-holt]]',Status:'open',Pressure:'hot',impulse:`Order arriving faster than justice. Every problem he solves makes him harder to remove.`,portents:`- The [[ashfen]] inspection forces a confrontation\n- Caldrin has a public success or a public defeat\n- [[edrienne-vale|Edrienne]] formalises his role`,doom:`Caldrin is recognised as the authority who resolved the Marches problem; the [[marchwardens]] reorganise under him.`,next:`Inspection patrol at [[ashfen]]; confrontation one session away.`,use:`Use when the table needs a visible example of order arriving faster than justice.`}},
'hearthbound-refusal':{type:'thread',title:'The Hearthbound Refusal',clock:{pos:4,portent:`Open armed conflict at the gate`},lead:`[[ashfen]] has denied a Marchwarden inspection. [[caldrin-holt|Caldrin]] will arrive personally within a day of the refusal.`,f:{Parent:'[[campaign-arc]]','Driven by':'[[hearthbound]]',Status:'open',Pressure:'hot',impulse:`Their dead are kept, not surrendered.`,portents:`- The patrol presses at the gate\n- Open armed conflict at the gate`,doom:`The Hearthbound network is scattered or driven underground.`,next:`Village refuses; open conflict one session away.`,use:`What everyone knows the inspection is about: [[sera-dast|Sera Dast]]. What almost no one knows: [[gella-murst|Gella Murst]].`}},
'neck-wound':{type:'thread',title:'The Neck Wound Discovery',lead:`Some, but not all, [[persistants]] carry a small, precise hole at the base of the skull. Clean, consistent and deliberate.`,f:{Parent:'[[campaign-arc]]',Status:'open',Pressure:'rising',portents:`- Who is making the wound: a person, a tool, a process?\n- Does the wound create the Persistant, or mark someone killed a specific way?`,next:`[[ossuary-savant]] has studied this for two seasons. Richard's beat in Session 05.`}},

function loadCampaign(id){C=CAMPAIGNS[id];({pages:PAGES,hist:HIST,timeline:TL,clocks:CLOCKS,clack:CLACK,delta:DELTA,sess:SESS,props:PROPS}=C.data);}
let nextId=100;
const S={ws:'home',home:'gm',newCamp:false,page:'campaign-state',editing:false,prop:'p1',picking:false,sess:'s05',stab:'prep',lw:null,lwSent:null,q:'',treeShut:true,fresh:new Set(),tlFollow:'',tlTypes:new Set(['party','elsewhere','clock','reveal','history']),tlAdd:false};
const TLTYPES={party:['Party action','p-prepared'],elsewhere:['Happens elsewhere','p-review'],clock:['Clock','p-working'],reveal:['Revelation','p-accepted'],history:['History','p-draft']};

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const exists=id=>!!PAGES[id];
const nice=id=>id.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function wl(id,label){const p=PAGES[id];const pv=PV();const l=label||esc(p?(pv?pageName(id):p.title):nice(id));
 if(p&&pv&&!visible(id))return l;
 return p?`<a href="#" class="wl" data-link="${id}">${l}</a>`:`<span class="wl un" title="Not in this prototype sample">${l}</span>`;}
function inline(s){s=esc(s);s=s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,id,l)=>wl(id.trim(),l));
 return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function md(t){if(!t)return '';return String(t).split(/\n\s*\n/).map(b=>{const L=b.split('\n');
 if(L.every(l=>l.trim().startsWith('- ')))return '<ul>'+L.map(l=>'<li>'+inline(l.trim().slice(2))+'</li>').join('')+'</ul>';
 const out=[];let ul=[];L.forEach(l=>{if(l.trim().startsWith('- '))ul.push('<li>'+inline(l.trim().slice(2))+'</li>');else{if(ul.length){out.push('<ul>'+ul.join('')+'</ul>');ul=[];}out.push(inline(l)+'<br>');}});if(ul.length)out.push('<ul>'+ul.join('')+'</ul>');
 return '<p>'+out.join('').replace(/<br>$/,'')+'</p>';}).join('');}
const clockHTML=(pos,max=5)=>`<span class="clock ${pos>=max?'full':''}" aria-label="${pos} of ${max}">${Array.from({length:max},(_,i)=>`<i class="${i<pos?'f':''}"></i>`).join('')}</span>`;
function fmtDay(abs,camp){const cal=CALENDARS[(camp||C).calendar];const y=Math.floor(abs/360),m=Math.floor((abs%360)/30),d=abs%30+1;return `${d} ${cal.months[m]} ${y}${cal.era?' '+cal.era:''}`;}
function pageText(id){const p=PAGES[id];return [p.lead,...Object.values(p.f||{}),...(p.body||[]).map(b=>b.t),...(p.routes||[]).map(r=>r.t),...(p.areas||[]).map(a=>a.t)].join('\n');}
const refs=(text,id)=>new RegExp('\\[\\['+id.replace(/-/g,'\\-')+'(\\||\\]\\])').test(text);
const backlinks=id=>Object.keys(PAGES).filter(o=>o!==id&&refs(pageText(o),id));
function outlinks(id){const out=new Set();pageText(id).replace(/\[\[([^\]|]+)/g,(m,x)=>out.add(x.trim()));out.delete(id);return [...out];}
const eventsFor=id=>TL.filter(e=>(e.links||[]).includes(id)||refs(e.text,id)).sort((a,b)=>a.day-b.day);
const sessionsMentioning=id=>Object.entries(SESS).filter(([k,s])=>refs(JSON.stringify(s),id)).map(([k])=>k);
const idByTitle=t=>Object.keys(PAGES).find(k=>PAGES[k].title.toLowerCase()===String(t).trim().toLowerCase());
function toast(html,actLabel,act){const t=$('#toast');t.innerHTML=`<span>${html}</span>`+(actLabel?`<button id="tact">${actLabel}</button>`:'');t.hidden=false;
 if(actLabel)$('#tact').onclick=()=>{t.hidden=true;act();};clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,6000);}
const prop=()=>PROPS.find(p=>p.id===S.prop)||PROPS[0];
const lensesOf=p=>[...new Set(p.thread.filter(m=>m.lens).map(m=>m.lens))];
function fieldLabel(type,key){const T=TYPES[type]||{};const all=[...(T.f||[]),...(T.triad||[]),['voice','Voice'],['impression','First impression'],['public','Public face'],['hidden','Hidden truth'],['willdo','Will do'],['wont','Won\'t do'],['player','Player-facing text']];const f=all.find(x=>x[0]===key);return f?f[1]:key;}
function fieldsFor(type){const T=TYPES[type];const out=[];(T.glance||[]).forEach(k=>out.push([k,k,1]));
 if(T.fam==='person'){T.triad.forEach(x=>out.push(x));out.push(['voice','Voice']);}
 
 if(T.fam==='faction')out.push(['public','Public face'],['hidden','Hidden truth'],['willdo','Will do'],['wont','Won\'t do']);
 
 if(T.fam==='handout')out.push(['player','Player-facing text']);
 (T.f||[]).filter(x=>!['AREAS','CHILDREN','PEOPLE','impression','effects'].includes(x[0])||x[0]==='effects'||x[0]==='impression').filter(x=>!['AREAS','CHILDREN','PEOPLE'].includes(x[0])&&!out.some(o=>o[0]===x[0])).forEach(x=>out.push(x));return out;}
const studioFor=type=>STUDIOS[type]||STUDIOS.free;

/* ================= NAV ================= */

function go(id){$('#hover').hidden=true;S.ws='wiki';S.page=id;S.editing=false;render();const d=$('#wiki .doc');if(d)d.scrollTop=0;window.scrollTo(0,0);}
function openCampaign(id){loadCampaign(id);S.page='campaign-state';S.prop=(PROPS.find(p=>p.status!=='accepted')||PROPS[0]||{}).id;S.sess=Object.keys(SESS).find(k=>SESS[k].status!=='played')||'timeline';S.lw=null;S.lwSent=null;S.fresh=new Set();setWS('wiki');}
function closePeek(){$('#overlay').innerHTML='';}
function peekShell(inner){$('#overlay').innerHTML=`<div class="scrim" data-close></div><aside class="peek" role="dialog">${inner}</aside>`;}
function peek(id){const p=PAGES[id];if(!p)return;const T=TYPES[p.type];
 const g=(T.glance||[]).filter(k=>p.f?.[k]).map(k=>`<dt>${esc(k)}</dt><dd>${inline(p.f[k])}</dd>`).join('');
 const tri=(T.triad||[]).filter(([k])=>p.f?.[k]).map(([k,l])=>`<dt>${esc(l)}</dt><dd>${inline(p.f[k])}</dd>`).join('');
 peekShell(`<div class="peek-h"><span class="eyebrow">${T.label} · quick look</span><button class="btn ghost" data-close>Close</button></div>
  <h2>${esc(p.title)}</h2><div class="lead" style="font-size:1.05rem">${inline(p.lead||'')}</div>
  ${p.f?.voice?`<blockquote class="voice">${esc(p.f.voice)}</blockquote>`:''}
  ${g||tri?`<dl class="facts">${g}${tri}</dl>`:''}<button class="btn primary" data-go="${id}">Open in Wiki</button>`);}
function peekEvent(eid){const e=TL.find(x=>x.id===eid);if(!e)return;const [lab,cls]=TLTYPES[e.type];
 peekShell(`<div class="peek-h"><span class="eyebrow">Timeline event</span><button class="btn ghost" data-close>Close</button></div>
  <div class="ev-date">${esc(e.past?e.label:fmtDay(e.day))}</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><span class="pill ${cls}">${lab}</span>${e.sess?`<span class="pill p-draft">Session ${SESS[e.sess].n}</span>`:''}${e.src?`<span class="pill p-accepted">${esc(e.src)}</span>`:''}</div>
  <div class="lead" style="font-size:1.1rem">${md(e.text)}</div>
  ${(e.links||[]).length?`<div class="eyebrow" style="margin:16px 0 6px">Involved · follow on the timeline</div><div class="chips">${e.links.map(id=>`<button class="chip-btn" data-follow="${id}">${esc(PAGES[id]?.title||nice(id))}</button>`).join('')}</div>`:''}`);}

    <div class="eyebrow" style="margin:14px 0 4px">House rulings</div>
    <ul class="plain">${rulings.map(([id,p])=>`<li><a href="#" class="wl" data-openpage="${c.id}:${id}">${esc(p.title)}</a> <span class="muted small">${esc(p.f.Label||'')}</span></li>`).join('')||'<li class="muted">None yet.</li>'}</ul>
